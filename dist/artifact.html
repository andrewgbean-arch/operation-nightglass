// ---------- save/load -----------------------------------------------------------
function save() {
  if (!G.sceneId || G.sceneId === 'rooftop') return;
  store.set('nightglass_save', { flags: G.flags, inv: G.inv, scene: G.sceneId, x: G.jack.x, y: G.jack.y, facing: G.jack.facing, objective: G.objective });
}
function hasSave() { return !!store.get('nightglass_save'); }
async function loadGame() {
  const s = store.get('nightglass_save');
  if (!s) return newGame();
  G.flags = s.flags || {}; G.inv = s.inv || []; G.objective = s.objective || '';
  G.objT = 99;
  startPlay();
  G.sceneId = null;
  await gotoScene(s.scene, s.x, s.y, s.facing, { instant: true });
}
function restartScene() {
  const s = store.get('nightglass_save');
  if (G.mode === 'rooftop') { Rooftop.start(); return; }
  if (s) loadGame();
}
function startPlay() {
  G.mode = 'play'; G.paused = false; G.speech = []; G.choices = null; G.overlay = null; G.sel = null;
  G.busy = false;
  G.jack = makeFigure('jack', 400, 900, { id: 'jack', scale: 2, seed: 1 });
}

// ---------- main loop ------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  G.t += dt;
  G.fade += clamp(G.fadeTo - G.fade, -dt * G.fadeSpeed, dt * G.fadeSpeed);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.mode === 'title') Title.draw(ctx, dt);
  else if (G.mode === 'text') TextScreen.draw(ctx, dt);
  else if (G.mode === 'rooftop') { if (!G.paused) Rooftop.update(dt); Rooftop.draw(ctx, dt); drawSpeech(ctx); drawHud(ctx, dt); }
  else if (G.mode === 'play') { if (!G.paused) update(dt); draw(ctx, dt); }
  if (G.fade > 0.001) { ctx.fillStyle = `rgba(0,0,0,${G.fade})`; ctx.fillRect(0, 0, W, H); }
  if (G.paused) Pause.draw(ctx);
  drawCursor(ctx);
  requestAnimationFrame(frame);
}

function update(dt) {
  const sc = G.scene;
  for (const a of G.actors) updateWalker(a, dt);
  for (const s of G.speech) { s.t += dt; if (s.t > s.dur) endSpeech(s); }
  if (sc._rain) sc._rain.update(dt, sc.rain.ground);
  if (sc.update) sc.update(dt, G.t);
}
function draw(ctx, dt) {
  const sc = G.scene, t = G.t;
  ctx.drawImage(sceneBg(G.sceneId), 0, 0);
  if (sc.back) sc.back(ctx, t);
  // Actors and props sorted by depth.
  const items = G.actors.filter(a => !a.hidden).map(a => ({ y: a.y, a }));
  if (sc.props) for (const p of sc.props) if (!p.when || p.when()) items.push({ y: p.y, p });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) {
    if (it.a) drawFigure(ctx, it.a, t, it.a.light || sc.light);
    else it.p.draw(ctx, t);
  }
  if (sc.front) sc.front(ctx, t);
  if (sc._rain) sc._rain.draw(ctx);
  drawVignette(ctx, sc.vignette ?? 0.7);
  drawGrain(ctx, 0.06);
  if (G.overlay) G.overlay.draw(ctx, dt);
  drawSpeech(ctx);
  Choices.draw(ctx);
  drawInventory(ctx);
  drawHud(ctx, dt);
  if (DEBUG.on) DEBUG.draw(ctx);
}

const DEBUG = {
  on: /debug/.test(location.hash),
  draw(ctx) {
    ctx.save();
    ctx.strokeStyle = 'lime'; ctx.lineWidth = 2;
    const p = G.scene.walk; ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
    ctx.closePath(); ctx.stroke();
    ctx.strokeStyle = 'magenta';
    for (const h of G.scene.hotspots || []) {
      if (h.rect) ctx.strokeRect(...h.rect);
      if (h.at) { ctx.fillStyle = 'magenta'; ctx.fillRect(h.at[0] - 4, h.at[1] - 4, 8, 8); }
    }
    ctx.fillStyle = 'lime'; ctx.font = '20px monospace';
    ctx.fillText(`${G.mouse.x | 0}, ${G.mouse.y | 0}`, G.mouse.x + 20, G.mouse.y);
    ctx.restore();
  },
};

// ---- js/paint.js
// ---------------------------------------------------------------------------
// Paint — the painted backgrounds. Each scene is composed from gradients,
// shapes and light, then passed through the painterly brush filter.
// ---------------------------------------------------------------------------

// Shared: a night sky with a soft city glow at the horizon.
function paintSky(ctx, y0, y1, top = '#07101c', mid = '#10223a', glowCol = 'rgba(214,132,70,0.35)') {
  ctx.fillStyle = linGrad(ctx, 0, y0, 0, y1, [[0, top], [0.7, mid], [1, '#243a52']]);
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.save();
  ctx.fillStyle = linGrad(ctx, 0, y1 - 260, 0, y1, [[0, 'rgba(0,0,0,0)'], [1, glowCol]]);
  ctx.fillRect(0, y1 - 260, W, 260);
  ctx.restore();
  // Low rain clouds.
  const r = rng(11);
  ctx.save();
  for (let i = 0; i < 40; i++) {
    ctx.globalAlpha = 0.05 + r() * 0.06;
    ellipse(ctx, r() * W, y0 + r() * (y1 - y0) * 0.6, 200 + r() * 300, 30 + r() * 50, '#5a6f86');
  }
  ctx.restore();
}

// Shared: a band of baroque rooftops with lit windows.
function paintSkyline(ctx, seed, baseY, h, color, winAlpha, opts = {}) {
  const r = rng(seed);
  let x = opts.x0 ?? -40;
  const x1 = opts.x1 ?? W + 40;
  ctx.save();
  while (x < x1) {
    const bw = 90 + r() * 170, bh = h * (0.55 + r() * 0.5);
    const top = baseY - bh;
    ctx.fillStyle = color;
    ctx.fillRect(x, top, bw, bh + 4);
    // mansard / gable roofs
    const roof = r();
    if (roof < 0.4) poly(ctx, [x - 4, top, x + bw + 4, top, x + bw - 14, top - 26, x + 14, top - 26], color);
    else if (roof < 0.6) poly(ctx, [x, top, x + bw, top, x + bw / 2, top - 40 - r() * 30], color);
    else if (roof < 0.68 && !opts.noDomes) {
      ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x + bw / 2, top, bw * 0.3, bw * 0.34, 0, Math.PI, 0); ctx.fill();
      ctx.fillRect(x + bw / 2 - 3, top - bw * 0.34 - 30, 6, 32);
    }
    // chimneys
    if (r() < 0.6) ctx.fillRect(x + r() * bw * 0.8, top - 34, 14, 36);
    // windows
    const cols = Math.floor(bw / 34), rows = Math.floor(bh / 52);
    for (let cx = 0; cx < cols; cx++) for (let ry = 0; ry < rows; ry++) {
      const lit = r();
      if (lit < 0.28) {
        ctx.fillStyle = `rgba(255,${170 + (r() * 50) | 0},${90 + (r() * 60) | 0},${winAlpha * (0.5 + r() * 0.5)})`;
        ctx.fillRect(x + 10 + cx * 34, top + 18 + ry * 52, 14, 24);
      } else if (lit < 0.5) {
        ctx.fillStyle = `rgba(20,30,45,${winAlpha * 0.5})`;
        ctx.fillRect(x + 10 + cx * 34, top + 18 + ry * 52, 14, 24);
      }
    }
    x += bw + (r() < 0.2 ? 10 : 0);
  }
  ctx.restore();
}

// Big baroque dome silhouette (Karlskirche-ish).
function paintDome(ctx, cx, baseY, s, color, lit) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.fillRect(cx - 120 * s, baseY - 120 * s, 240 * s, 120 * s);
  ctx.fillRect(cx - 70 * s, baseY - 190 * s, 140 * s, 80 * s);
  ctx.beginPath(); ctx.ellipse(cx, baseY - 190 * s, 80 * s, 95 * s, 0, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx - 12 * s, baseY - 320 * s, 24 * s, 50 * s);
  ctx.beginPath(); ctx.ellipse(cx, baseY - 320 * s, 16 * s, 22 * s, 0, Math.PI, 0); ctx.fill();
  ctx.fillRect(cx - 2 * s, baseY - 370 * s, 4 * s, 40 * s);
  // columns flanking
  for (const d of [-1, 1]) {
    ctx.fillRect(cx + d * 170 * s - 18 * s, baseY - 230 * s, 36 * s, 230 * s);
    ctx.fillRect(cx + d * 170 * s - 24 * s, baseY - 240 * s, 48 * s, 14 * s);
  }
  if (lit) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = linGrad(ctx, 0, baseY - 300 * s, 0, baseY, [[0, 'rgba(0,0,0,0)'], [1, lit]]);
    ctx.beginPath(); ctx.ellipse(cx, baseY - 190 * s, 80 * s, 95 * s, 0, Math.PI, 0); ctx.fill();
    ctx.fillRect(cx - 120 * s, baseY - 120 * s, 240 * s, 120 * s);
  }
  ctx.restore();
}

// Wet cobblestones in perspective with light reflections.
function paintCobbles(ctx, y0, base, stone, seed) {
  ctx.fillStyle = linGrad(ctx, 0, y0, 0, H, [[0, base], [1, shadeColor(base, -0.4)]]);
  ctx.fillRect(0, y0, W, H - y0);
  const r = rng(seed);
  for (let row = 0; row < 40; row++) {
    const t = row / 40, y = y0 + Math.pow(t, 1.6) * (H - y0);
    const sh = 3 + t * 16, sw = 10 + t * 40;
    for (let x = -20 + (row % 2) * sw * 0.5; x < W + 20; x += sw * (1.02 + r() * 0.1)) {
      ctx.globalAlpha = 0.35 + r() * 0.35;
      ellipse(ctx, x, y, sw * 0.44, sh * 0.42, r() < 0.5 ? stone : shadeColor(stone, -0.2));
    }
  }
  ctx.globalAlpha = 1;
}

// Vertical streak reflection of a light in a wet surface.
function reflection(ctx, x, y, w, h, color, alpha = 0.5) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha;
  ctx.fillStyle = linGrad(ctx, 0, y, 0, y + h, [[0, color], [1, 'rgba(0,0,0,0)']]);
  const r = rng((x * 7 + y) | 0);
  for (let i = 0; i < 26; i++) {
    const dx = (r() - 0.5) * w, ww = 2 + r() * w * 0.2;
    ctx.fillRect(x + dx - ww / 2, y + r() * 12, ww, h * (0.4 + r() * 0.6));
  }
  ctx.restore();
}

// Viennese ornate lamp post.
function paintLampPost(ctx, x, groundY, topY, color = '#0f1418') {
  ctx.fillStyle = color;
  ctx.fillRect(x - 7, topY + 40, 14, groundY - topY - 40);
  ctx.fillRect(x - 16, groundY - 30, 32, 30);
  ctx.fillRect(x - 11, groundY - 70, 22, 40);
  // lantern
  poly(ctx, [x - 26, topY + 38, x + 26, topY + 38, x + 20, topY, x - 20, topY], color);
  poly(ctx, [x - 22, topY + 34, x + 22, topY + 34, x + 17, topY + 4, x - 17, topY + 4], '#ffcf87');
  poly(ctx, [x - 30, topY, x + 30, topY, x, topY - 26], color);
  ctx.fillRect(x - 2, topY - 42, 4, 18);
}

// Tall panelled door.
function paintDoor(ctx, x, y, w, h, wood, dark, handle = '#c9a13b', double = true) {
  ctx.fillStyle = shadeColor(dark, -0.3);
  ctx.fillRect(x - 16, y - 20, w + 32, h + 20);
  ctx.fillStyle = linGrad(ctx, x, 0, x + w, 0, [[0, dark], [0.5, wood], [1, dark]]);
  ctx.fillRect(x, y, w, h);
  const leaves = double ? 2 : 1, lw = w / leaves;
  for (let l = 0; l < leaves; l++) {
    const lx = x + l * lw;
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 3;
    ctx.strokeRect(lx + 2, y + 2, lw - 4, h - 4);
    for (const [py, ph] of [[0.06, 0.4], [0.52, 0.4]]) {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(lx + lw * 0.16, y + h * py, lw * 0.68, h * ph);
      ctx.strokeStyle = 'rgba(255,220,170,0.1)';
      ctx.strokeRect(lx + lw * 0.16, y + h * py, lw * 0.68, h * ph);
    }
  }
  ellipse(ctx, x + w / 2 - 12, y + h * 0.5, 5, 5, handle);
  if (double) ellipse(ctx, x + w / 2 + 12, y + h * 0.5, 5, 5, handle);
}

// Gilt picture frame.
function paintFrame(ctx, x, y, w, h, inner) {
  ctx.fillStyle = linGrad(ctx, x, y, x + w, y + h, [[0, '#8a6a2a'], [0.5, '#d9b35c'], [1, '#6b4f1c']]);
  ctx.fillRect(x - 16, y - 16, w + 32, h + 32);
  ctx.fillStyle = '#3a2a10'; ctx.fillRect(x - 4, y - 4, w + 8, h + 8);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); inner(ctx); ctx.restore();
}

// A painted portrait of Colonel Vasko, vain and heroic.
function paintVaskoPortrait(ctx, x, y, w, h) {
  paintFrame(ctx, x, y, w, h, c => {
    c.fillStyle = radGrad(c, x + w * 0.5, y + h * 0.35, 10, h, [[0, '#6b3a2a'], [1, '#1a0c08']]);
    c.fillRect(x, y, w, h);
    const cx = x + w / 2, s = w / 260;
    // shoulders + uniform
    poly(c, [cx - 120 * s, y + h, cx - 110 * s, y + h - 150 * s, cx - 40 * s, y + h - 200 * s, cx + 40 * s, y + h - 200 * s, cx + 110 * s, y + h - 150 * s, cx + 120 * s, y + h], '#2d3440');
    // epaulettes, medals, sash
    ellipse(c, cx - 88 * s, y + h - 170 * s, 30 * s, 10 * s, '#c9a13b');
    ellipse(c, cx + 88 * s, y + h - 170 * s, 30 * s, 10 * s, '#c9a13b');
    poly(c, [cx - 80 * s, y + h - 160 * s, cx - 55 * s, y + h - 170 * s, cx + 90 * s, y + h, cx + 55 * s, y + h], '#8a1a2c');
    for (let i = 0; i < 5; i++) ellipse(c, cx - 50 * s + i * 14 * s, y + h - 120 * s, 5 * s, 7 * s, i % 2 ? '#d9b35c' : '#c0c0c0');
    // neck + head
    c.fillStyle = '#b98465'; c.fillRect(cx - 18 * s, y + h - 225 * s, 36 * s, 35 * s);
    ellipse(c, cx, y + h - 270 * s, 44 * s, 56 * s, '#c8906f');
    c.fillStyle = 'rgba(0,0,0,0.25)'; c.beginPath(); c.ellipse(cx - 18 * s, y + h - 268 * s, 26 * s, 52 * s, 0, 0, 7); c.fill();
    // cap
    poly(c, [cx - 52 * s, y + h - 300 * s, cx + 52 * s, y + h - 300 * s, cx + 62 * s, y + h - 345 * s, cx - 48 * s, y + h - 352 * s], '#2a2f38');
    c.fillStyle = '#9e1f28'; c.fillRect(cx - 52 * s, y + h - 310 * s, 104 * s, 10 * s);
    poly(c, [cx - 50 * s, y + h - 300 * s, cx + 56 * s, y + h - 300 * s, cx + 40 * s, y + h - 288 * s, cx - 40 * s, y + h - 290 * s], '#111');
    ellipse(c, cx, y + h - 330 * s, 8 * s, 8 * s, '#c9a13b');
    // stern features
    c.fillStyle = '#1a0f0a'; c.fillRect(cx - 24 * s, y + h - 276 * s, 14 * s, 4 * s); c.fillRect(cx + 10 * s, y + h - 276 * s, 14 * s, 4 * s);
    c.fillStyle = '#2a1a12'; c.fillRect(cx - 22 * s, y + h - 250 * s, 44 * s, 8 * s); // moustache
    // painterly highlight
    glow(c, cx + 20 * s, y + h - 290 * s, 60 * s, 'rgba(255,200,150,0.25)');
  });
}

// ===========================================================================
// HOTEL SUITE
// ===========================================================================
function paintHotel(ctx) {
  // wall
  ctx.fillStyle = linGrad(ctx, 0, 0, 0, 700, [[0, '#0e2029'], [0.6, '#173440'], [1, '#12262f']]);
  ctx.fillRect(0, 0, W, 700);
  // damask stripes
  for (let x = 0; x < W; x += 64) {
    ctx.fillStyle = 'rgba(255,255,255,0.025)'; ctx.fillRect(x, 90, 30, 430);
    for (let y = 120; y < 510; y += 70) {
      ctx.save(); ctx.globalAlpha = 0.06;
      poly(ctx, [x + 47, y, x + 57, y + 18, x + 47, y + 36, x + 37, y + 18], '#9ec3c6');
      ctx.restore();
    }
  }
  // crown moulding + chair rail + dado panels
  ctx.fillStyle = linGrad(ctx, 0, 40, 0, 95, [[0, '#2b3b3d'], [0.5, '#5a6b66'], [1, '#1b2628']]);
  ctx.fillRect(0, 40, W, 55);
  ctx.fillStyle = '#081116'; ctx.fillRect(0, 0, W, 40);
  ctx.fillStyle = linGrad(ctx, 0, 515, 0, 535, [[0, '#51605c'], [1, '#1d2a2c']]);
  ctx.fillRect(0, 515, W, 20);
  ctx.fillStyle = '#0d1c22'; ctx.fillRect(0, 535, W, 165);
  for (let x = 20; x < W; x += 190) {
    ctx.strokeStyle = 'rgba(160,200,200,0.1)'; ctx.lineWidth = 3;
    ctx.strokeRect(x, 560, 160, 115);
  }
  // baseboard
  ctx.fillStyle = linGrad(ctx, 0, 690, 0, 712, [[0, '#3b4745'], [1, '#0a1114']]);
  ctx.fillRect(0, 688, W, 24);

  // carpet
  ctx.fillStyle = linGrad(ctx, 0, 705, 0, H, [[0, '#2a0b10'], [0.4, '#45121b'], [1, '#1c0609']]);
  ctx.fillRect(0, 705, W, H - 705);
  // carpet border + medallion pattern in perspective
  ctx.save();
  for (let i = 0; i < 9; i++) {
    const t = i / 9, y = 720 + Math.pow(t, 1.5) * 360;
    ctx.strokeStyle = `rgba(212,160,90,${0.05 + t * 0.06})`; ctx.lineWidth = 1 + t * 3;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    for (let x = (i % 2) * 90; x < W; x += 180) {
      ctx.globalAlpha = 0.08 + t * 0.08;
      poly(ctx, [x, y + 8 + t * 18, x + 30 + t * 30, y + 16 + t * 34, x, y + 24 + t * 50, x - 30 - t * 30, y + 16 + t * 34], '#b0703a');
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();

  // --- window with city view -----------------------------------------------
  const wx = 780, wy = 130, ww = 320, wh = 510;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(wx, wy + wh); ctx.lineTo(wx, wy + ww / 2); ctx.arc(wx + ww / 2, wy + ww / 2, ww / 2, Math.PI, 0); ctx.lineTo(wx + ww, wy + wh); ctx.closePath();
  ctx.clip();
  ctx.fillStyle = linGrad(ctx, 0, wy, 0, wy + wh, [[0, '#07121f'], [0.6, '#15304b'], [1, '#3a3a45']]);
  ctx.fillRect(wx, wy, ww, wh);
  paintDome(ctx, wx + 190, wy + 430, 0.55, '#0b1522', 'rgba(255,190,120,0.25)');
  paintSkyline(ctx, 5, wy + wh, 150, '#0d1826', 0.9, { x0: wx - 20, x1: wx + ww + 20 });
  glow(ctx, wx + ww / 2, wy + wh, 260, 'rgba(255,150,80,0.25)');
  ctx.restore();
  // frame + mullions
  ctx.strokeStyle = '#c9c1ad'; ctx.lineWidth = 16;
  ctx.beginPath();
  ctx.moveTo(wx, wy + wh); ctx.lineTo(wx, wy + ww / 2); ctx.arc(wx + ww / 2, wy + ww / 2, ww / 2, Math.PI, 0); ctx.lineTo(wx + ww, wy + wh); ctx.closePath(); ctx.stroke();
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh);
  for (const yy of [wy + 200, wy + 340]) { ctx.moveTo(wx, yy); ctx.lineTo(wx + ww, yy); }
  ctx.stroke();
  ctx.fillStyle = '#8f8878'; ctx.fillRect(wx - 30, wy + wh, ww + 60, 18); // sill
  // window light spill on the floor
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.07;
  poly(ctx, [wx, 712, wx + ww, 712, wx + ww + 220, H, wx - 60, H], '#6fa0d8');
  ctx.restore();

  // curtains
  for (const [cx0, dir] of [[690, 1], [1100, -1]]) {
    const cw = 100;
    ctx.fillStyle = linGrad(ctx, cx0, 0, cx0 + cw, 0, [[0, '#0c2a1f'], [0.3, '#1d4a36'], [0.6, '#0d2a1f'], [0.85, '#23553e'], [1, '#0a2019']]);
    ctx.beginPath();
    ctx.moveTo(cx0, 90); ctx.lineTo(cx0 + cw, 90);
    ctx.quadraticCurveTo(cx0 + cw - dir * 20, 400, cx0 + cw + dir * 10, 700);
    ctx.lineTo(cx0 - dir * 5, 700);
    ctx.closePath(); ctx.fill();
    // tie-back
    ctx.fillStyle = '#c9a13b'; ctx.fillRect(cx0 + 20, 430, cw - 30, 10);
  }
  ctx.fillStyle = linGrad(ctx, 0, 88, 0, 140, [[0, '#123a2b'], [1, '#07170f']]);
  ctx.fillRect(670, 88, 560, 50); // pelmet
  ctx.fillStyle = '#c9a13b'; ctx.fillRect(670, 134, 560, 5);

  // --- wardrobe -------------------------------------------------------------
  const wdX = 80, wdY = 220, wdW = 250, wdH = 555;
  ctx.fillStyle = linGrad(ctx, wdX, 0, wdX + wdW, 0, [[0, '#1c0f08'], [0.55, '#4a2a17'], [1, '#2a170c']]);
  ctx.fillRect(wdX, wdY, wdW, wdH);
  poly(ctx, [wdX - 14, wdY, wdX + wdW + 14, wdY, wdX + wdW + 4, wdY - 26, wdX - 4, wdY - 26], '#2e1a0e');
  poly(ctx, [wdX + 60, wdY - 26, wdX + wdW - 60, wdY - 26, wdX + wdW / 2, wdY - 60], '#2e1a0e');
  texture(ctx, wdX, wdY, wdW, wdH, '#0c0603', 300, 60, 21, 0.25, Math.PI / 2);
  for (const dx of [0, wdW / 2]) {
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 3;
    ctx.strokeRect(wdX + dx + 14, wdY + 20, wdW / 2 - 28, wdH - 100);
    ctx.strokeStyle = 'rgba(255,200,140,0.12)';
    ctx.strokeRect(wdX + dx + 26, wdY + 36, wdW / 2 - 52, wdH - 132);
  }
  ellipse(ctx, wdX + wdW / 2 - 12, wdY + 270, 5, 7, '#c9a13b');
  ellipse(ctx, wdX + wdW / 2 + 12, wdY + 270, 5, 7, '#c9a13b');
  ctx.fillStyle = '#1a0d06'; ctx.fillRect(wdX, wdY + wdH - 60, wdW, 60);
  ctx.strokeStyle = 'rgba(255,200,140,0.1)'; ctx.strokeRect(wdX + 20, wdY + wdH - 50, wdW - 40, 40);

  // --- painting above desk ---------------------------------------------------
  paintFrame(ctx, 440, 230, 220, 160, c => {
    c.fillStyle = linGrad(c, 0, 230, 0, 390, [[0, '#2b3b4a'], [1, '#56503a']]);
    c.fillRect(440, 230, 220, 160);
    poly(c, [440, 350, 520, 300, 580, 330, 660, 290, 660, 390, 440, 390], '#27301e');
    ellipse(c, 610, 270, 18, 18, 'rgba(240,220,170,0.7)');
  });

  // --- desk -----------------------------------------------------------------
  ctx.fillStyle = '#1e0f07';
  for (const lx of [420, 675]) { ctx.fillRect(lx, 625, 14, 150); }
  ctx.fillStyle = linGrad(ctx, 400, 0, 710, 0, [[0, '#3a200f'], [0.5, '#6b3d1f'], [1, '#3a200f']]);
  ctx.fillRect(400, 604, 310, 22);
  ctx.fillStyle = '#2b170b'; ctx.fillRect(410, 626, 290, 48);
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2; ctx.strokeRect(560, 634, 130, 32);
  ellipse(ctx, 625, 650, 5, 5, '#c9a13b');
  // lamp
  ctx.fillStyle = '#8a6a2a'; ctx.fillRect(466, 520, 8, 84);
  ellipse(ctx, 470, 602, 22, 6, '#6b4f1c');
  poly(ctx, [430, 520, 510, 520, 492, 462, 448, 462], '#d8a860');
  glow(ctx, 470, 500, 260, 'rgba(255,170,80,0.55)');
  glow(ctx, 470, 610, 140, 'rgba(255,190,110,0.35)');
  // briefcase
  ctx.fillStyle = linGrad(ctx, 0, 572, 0, 606, [[0, '#2a2522'], [1, '#0d0b0a']]);
  rrect(ctx, 522, 572, 160, 34, 5); ctx.fill();
  ctx.strokeStyle = '#3c3632'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(602, 572, 14, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = '#c9a13b'; ctx.fillRect(545, 583, 14, 8); ctx.fillRect(645, 583, 14, 8);
  // ashtray
  ellipse(ctx, 440, 602, 16, 5, 'rgba(200,220,230,0.5)');

  // --- bed ------------------------------------------------------------------
  ctx.fillStyle = linGrad(ctx, 1160, 0, 1200, 0, [[0, '#1d0f07'], [1, '#4a2a17']]);
  ctx.fillRect(1160, 430, 40, 360);
  ctx.beginPath(); ctx.ellipse(1180, 430, 22, 40, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#d9d2c2'; ctx.fillRect(1198, 640, 350, 40);
  ellipse(ctx, 1260, 632, 60, 22, '#e6e0d2');
  ctx.fillStyle = linGrad(ctx, 0, 650, 0, 790, [[0, '#23553e'], [1, '#0c2a1f']]);
  ctx.beginPath(); ctx.moveTo(1300, 652); ctx.lineTo(1550, 650); ctx.lineTo(1556, 780); ctx.quadraticCurveTo(1420, 792, 1290, 784); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c9a13b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(1292, 770); ctx.quadraticCurveTo(1420, 780, 1553, 768); ctx.stroke();
  ctx.fillStyle = '#3a200f'; ctx.fillRect(1545, 600, 26, 190);
  ellipse(ctx, 1558, 600, 16, 14, '#4a2a17');
  // --- nightstand + phone ------------------------------------------------------
  ctx.fillStyle = linGrad(ctx, 1590, 0, 1700, 0, [[0, '#2a170c'], [1, '#4a2a17']]);
  ctx.fillRect(1590, 662, 110, 126);
  ctx.fillStyle = '#5a3520'; ctx.fillRect(1584, 654, 122, 12);
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.strokeRect(1600, 684, 90, 36);
  ellipse(ctx, 1645, 702, 4, 4, '#c9a13b');
  // rotary phone
  poly(ctx, [1606, 654, 1676, 654, 1668, 626, 1614, 626], '#0e0e10');
  ctx.fillStyle = '#18181b'; rrect(ctx, 1600, 608, 82, 16, 7); ctx.fill();
  ellipse(ctx, 1641, 640, 12, 9, '#d9d2c2');
  ellipse(ctx, 1641, 640, 4, 3, '#0e0e10');
  // newspaper on the nightstand? keep clean.
  // wall sconce
  ctx.fillStyle = '#8a6a2a'; ctx.fillRect(1632, 360, 8, 40);
  poly(ctx, [1616, 360, 1656, 360, 1648, 330, 1624, 330], '#e8c080');
  glow(ctx, 1636, 350, 220, 'rgba(255,170,80,0.4)');
  ctx.fillStyle = '#8a6a2a'; ctx.fillRect(560, 150, 6, 0);

  // --- door -----------------------------------------------------------------
  paintDoor(ctx, 1730, 200, 160, 590, '#4a2a17', '#24130a');
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,190,110,0.5)'; ctx.fillRect(1730, 786, 160, 4);
  ctx.restore();
  // pool of warm light and shadows grounding furniture
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  for (const [x, w] of [[205, 150], [555, 170], [1360, 230], [1645, 70]]) { ctx.beginPath(); ctx.ellipse(x, 785, w, 12, 0, 0, 7); ctx.fill(); }
  ctx.restore();
  glow(ctx, 520, 820, 520, 'rgba(255,150,70,0.16)');
  fog(ctx, 300, 760, 'rgba(120,160,180,0.06)', 1);
}

// ===========================================================================
// STREET — rainy square outside the hotel
// ===========================================================================
function paintStreet(ctx) {
  paintSky(ctx, 0, 560);
  paintDome(ctx, 1220, 470, 0.9, '#0c1624', 'rgba(255,170,100,0.18)');
  paintSkyline(ctx, 31, 520, 230, '#101b29', 0.8);
  fog(ctx, 360, 620, 'rgba(120,150,180,0.25)', 1);
  paintSkyline(ctx, 47, 560, 180, '#141f2c', 0.9, { noDomes: true });
  // Street-level frontages behind the square.
  ctx.fillStyle = linGrad(ctx, 0, 540, 0, 800, [[0, '#151e29'], [1, '#0d131a']]);
  ctx.fillRect(0, 540, W, 262);
  for (const [sx, sw] of [[1045, 70], [1425, 60]]) {
    ctx.fillStyle = 'rgba(255,180,100,0.35)'; ctx.fillRect(sx, 620, sw, 110);
    ctx.fillStyle = '#0d131a'; ctx.fillRect(sx + sw / 2 - 3, 620, 6, 110);
  }

  // Street receding right toward the consulate.
  ctx.fillStyle = '#1c232c';
  poly(ctx, [1480, 800, 1920, 800, 1920, 560, 1760, 560], '#1a222b');
  // Distant consulate with red flags
  ctx.fillStyle = '#3a3a40'; ctx.fillRect(1700, 470, 170, 95);
  poly(ctx, [1690, 470, 1880, 470, 1785, 430], '#3a3a40');
  for (let i = 0; i < 5; i++) { ctx.fillStyle = 'rgba(255,200,130,0.7)'; ctx.fillRect(1712 + i * 32, 500, 12, 20); }
  glow(ctx, 1785, 540, 140, 'rgba(255,190,120,0.35)');
  for (const fx of [1712, 1858]) { ctx.fillStyle = '#222'; ctx.fillRect(fx, 440, 3, 40); ctx.fillStyle = '#a3182a'; ctx.fillRect(fx + 3, 440, 22, 14); }
  // Right-side tall facade in perspective
  poly(ctx, [1560, 120, 1920, 0, 1920, 820, 1560, 790], '#1b242f');
  for (let i = 0; i < 4; i++) for (let j = 0; j < 5; j++) {
    const x = 1590 + i * 80, y0 = 170 + j * 120 - i * 25;
    ctx.fillStyle = (i + j) % 3 === 0 ? 'rgba(255,190,110,0.55)' : 'rgba(10,16,24,0.8)';
    poly(ctx, [x, y0, x + 40, y0 - 10, x + 40, y0 + 70, x, y0 + 75], ctx.fillStyle);

function paintGate(ctx) {

  ctx.strokeStyle = '#070b10'; ctx.lineCap = 'round';

    const x2 = x + Math.sin(a) * len, y2 = y - Math.cos(a) * len;
    ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();

  };

  const bx = 660;
  ctx.fillStyle = linGrad(ctx, 0, 110, 0, 780, [[0, '#8a8472'], [0.5, '#6b6656'], [1, '#3a372e']]);

    for (const [dx, dir] of [[-50, 1], [160, -1]]) {

  glow(ctx, 1815, 330, 120, 'rgba(255,200,120,0.18)');
  // steps rising from (1470, 800) to (1880, 460)

    const t = i / steps;
    const x0 = 1470 + t * 360, y0 = 800 - t * 340;

  ctx.fillStyle = linGrad(ctx, 0, 780, 0, H, [[0, '#3a2210'], [1, '#1a0e06']]);

}
// Crystal chandelier (drawn animated, so it sparkles).
function drawChandelier(ctx, cx, cy, t) {
  ctx.save();
  ctx.fillStyle = '#c9a13b'; ctx.fillRect(cx - 2, 0, 4, cy - 60);
  ctx.strokeStyle = '#d9b35c'; ctx.lineWidth = 4;
  for (const [rx, ry, yy] of [[130, 26, cy], [90, 18, cy - 40], [50, 10, cy - 70]]) {
    ctx.beginPath(); ctx.ellipse(cx, yy, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    for (let k = 0; k < 12; k++) {
      const a = k / 12 * Math.PI * 2, x = cx + Math.cos(a) * rx, y = yy + Math.sin(a) * ry;
      ctx.fillStyle = 'rgba(255,240,210,0.9)'; ctx.fillRect(x - 2, y, 4, 16);
      const tw = 0.5 + 0.5 * Math.sin(t * 3 + k * 1.7 + cx);
      glow(ctx, x, y - 4, 14 + tw * 10, 'rgba(255,230,170,0.9)', 0.6 + tw * 0.4);
    }
  }
  glow(ctx, cx, cy - 30, 380, 'rgba(255,200,120,0.28)');
  ctx.restore();
}

async function phoneCall() {
  flag('phoneRinging', false);
  Sound.sfx('phoneUp');
  G.jack.facing = 1;
  G.jack.arm = 'phone';
  await wait(0.5);
  await say(G.jack, 'Harrow.');
  await say('control', 'Control here. The microfilm is inside the Karvonian Consulate, as we feared.');
  await say('control', 'Colonel Vasko is hosting a reception there tonight. You\'re going to be his guest.');
  await say(G.jack, 'Without an invitation, I suppose.');
  await say('control', 'Our contact has one for you. She\'ll be at Café Adler, across the square.');
  await say('control', 'The recognition phrase is: "Does the Danube look blue to you tonight?"');
  await say('control', 'She answers: "Only when it rains."');
  await say(G.jack, 'And if she doesn\'t?');
  await say('control', 'Then you\'ve asked a stranger about the colour of a river. Good luck, Harrow. This call never happened.');

  flag('called', true);
  setObjective('Meet the contact at Café Adler');
  save();
}

async function buyPaper() {
  const v = actor('vendor');
  if (has('newspaper') || flag('boughtPaper')) return say(v, 'You already have the last copy, sir!');
  if (!has('coins')) {
    await say(G.jack, 'I\'ll take a paper... ah. My money is back in the hotel room.');
    return say(v, 'Then the news will have to wait for you, mein Herr.');
  }
  removeItem('coins');
  Sound.sfx('coin');
  await say(v, 'Four schillings. The last evening edition. Danke schön!');
  flag('boughtPaper', true);
  addItem('newspaper');
  await say(G.jack, 'I should read this. Right-click it in my inventory.');
}

async function talkVendor() {
  const v = actor('vendor');
  await say(v, 'Evening paper, sir? Hot off the press and wet from the rain.');
  for (;;) {
    const c = await choose([
      !flag('boughtPaper') && { text: 'I\'ll take a paper.', value: 'buy' },
      { text: 'Anything interesting in the news?', value: 'news' },
      { text: 'What do you know about the Karvonian Consulate?', value: 'consulate' },
      { text: 'Goodbye.', value: 'bye' },
    ]);
    if (c === 'buy') { await say(G.jack, 'I\'ll take a paper.'); await buyPaper(); }
    if (c === 'news') {
      await say(G.jack, 'Anything interesting in the news?');
      await say(v, 'The Karvonians are throwing a party. Their Colonel is on page one again.');
      await say(v, 'Vain as a peacock, that one. They say he has his own face on his cufflinks.');
    }
    if (c === 'consulate') {
      await say(G.jack, 'What do you know about the Karvonian Consulate?');
      await say(v, 'Big black cars. Big men with no necks. And tonight, champagne by the crate.');
      await say(v, 'Back home, the Colonel\'s birthday is practically a national holiday.');
    }
    if (c === 'bye') { await say(G.jack, 'Goodbye.'); return say(v, 'Servus! Mind the puddles.'); }
  }
}

function paintChair(ctx, x, y, s, dir) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * dir, s);
  ctx.strokeStyle = '#2a1408'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-30, 0); ctx.lineTo(-24, -54); ctx.moveTo(30, 0); ctx.lineTo(24, -54);
  ctx.moveTo(26, -54); ctx.quadraticCurveTo(40, -110, 26, -150); ctx.quadraticCurveTo(10, -160, 12, -120);
  ctx.stroke();
  ellipse(ctx, 0, -56, 36, 7, '#3a1e0c');
  ctx.restore();
}

async function talkFranz() {
  const f = actor('franz');
  f.facing = -1;
  await say(f, 'Grüß Gott. What can I get you, mein Herr?');
  for (;;) {
    const c = await choose([
      { text: 'A Melange, please.', value: 'coffee' },
      { text: 'Who is the lady in red?', value: 'lady' },
      { text: 'Heard anything about the Karvonian party?', value: 'party' },
      { text: 'Nothing, thanks.', value: 'bye' },
    ]);
    if (c === 'coffee') {
      await say(G.jack, 'A Melange, please.');
      Sound.sfx('clink');
      await say(f, 'Bitte sehr. On the house, for a gentleman who says please.');
      await say(G.jack, 'Perfect. Now I can face the Cold War.');
    }
    if (c === 'lady') {
      await say(G.jack, 'Who is the lady in red?');
      await say(f, 'Fräulein Ilse. Every evening she orders one coffee, smokes ten cigarettes and speaks to nobody.');
      await say(f, 'Perhaps you will be the exception.');
    }
    if (c === 'party') {
      await say(G.jack, 'Heard anything about the Karvonian party?');
      await say(f, 'Their waiters came here for ice this afternoon. Forty bottles of champagne, for eighty guests.');
      await say(f, 'And the old Baron von Katz is invited. Somebody will get very drunk. Probably him.');
    }
    if (c === 'bye') { await say(G.jack, 'Nothing, thanks.'); return say(f, 'Bitte. I am here if you need me.'); }
  }
}

async function talkIlse() {
  const i = actor('ilse');
  if (flag('ilseDone')) {
    await say(i, 'Why are you still here? Vasko\'s safe won\'t open itself.');
    await say(i, 'Remember, Jack: that man is in love with himself. Every detail of his life is about him.');
    return;
  }
  await say(i, 'This table is taken.');
  for (;;) {
    const c = await choose([
      flag('called') && { text: 'Does the Danube look blue to you tonight?', value: 'code' },
      { text: 'Lovely evening, isn\'t it?', value: 'weather' },
      { text: 'Can I buy you a drink?', value: 'drink' },
      { text: 'Sorry to bother you.', value: 'bye' },
    ]);
    if (c === 'weather') { await say(G.jack, 'Lovely evening, isn\'t it?'); await say(i, 'It is raining, and you are boring me.'); }
    if (c === 'drink') { await say(G.jack, 'Can I buy you a drink?'); await say(i, 'I have a coffee. And standards.'); }
    if (c === 'bye') { await say(G.jack, 'Sorry to bother you.'); return; }
    if (c === 'code') { await ilseBriefing(i); return; }
  }
}

async function ilseBriefing(i) {
  await say(G.jack, 'Does the Danube look blue to you tonight?');
  i.arm = 'rest';
  await wait(0.8);
  await say(i, '...Only when it rains.');
  await say(i, 'You are late, Mr. Harrow. Don\'t sit down. Just listen.');
  await say(i, 'Vasko keeps the microfilm in a wall safe in his private office, upstairs in the consulate.');
  await say(i, 'Here is your invitation. Guests only, black tie. Try not to embarrass me.');
  addItem('invitation');
  await say(G.jack, 'And the combination for the safe?');
  await say(i, 'Nobody knows it but Vasko. But he is the vainest man in Vienna. Everything he owns is about himself.');
  await say(i, 'Tonight the whole consulate is celebrating his birthday. Think about that.');
  await say(G.jack, 'And if there are guards on the stairs?');
  await say(i, 'Karvonian soldiers never leave their posts... unless there is a scandal. They hate a scandal.');
  i.arm = 'cig';
  flag('ilseDone', true);
  setObjective(flag('tux') ? 'Get into the consulate reception' : 'Get into the reception (black tie required)');
  save();
}

function drawDancers(ctx, t) {
  // Silhouetted couples waltzing behind the action.
  ctx.save();
  const couples = [[760, 0], [980, 2.1], [1220, 4.2]];
  for (const [cx, ph] of couples) {
    const a = t * 0.8 + ph;
    const x = cx + Math.cos(a) * 60, y = 800 + Math.sin(a) * 10, s = 0.85 + Math.sin(a) * 0.05;
    for (const side of [-1, 1]) {
      const dx = x + side * 12 * Math.cos(a * 2) * s;
      ctx.globalAlpha = 0.55;
      if (side < 0) { // gown
        poly(ctx, [dx - 10 * s, y - 110 * s, dx + 10 * s, y - 110 * s, dx + 34 * s, y, dx - 34 * s, y], '#4a1020');
        ctx.fillRect(dx - 9 * s, y - 150 * s, 18 * s, 44 * s);
      } else {
        ctx.fillStyle = '#0d0e12'; ctx.fillRect(dx - 11 * s, y - 150 * s, 22 * s, 150 * s);
      }
      ellipse(ctx, dx, y - 164 * s, 10 * s, 12 * s, side < 0 ? '#3a2410' : '#1a120c');
    }
  }
  ctx.restore();
}

// Walk without depth scaling (used on stairs).
function walkToFree(x, y, scale) {
  const j = G.jack;
  const sx = j.x, sy = j.y, ss = j.scale, d = dist(sx, sy, x, y);
  return new Promise(res => {
    let p = 0;
    j.walking = true;
    j.facing = x < sx ? -1 : 1;
    const speed = 260;
    let lastT = G.t;
    const tick = () => {
      const dt = G.t - lastT; lastT = G.t;
      p = Math.min(1, p + speed * dt / d);
      j.x = lerp(sx, x, p); j.y = lerp(sy, y, p); j.scale = lerp(ss, scale, p);
      j.walkPhase += speed * dt / (44 * j.scale) * Math.PI;
      if (p >= 1) { j.walking = false; res(); } else requestAnimationFrame(tick);
    };
    j.target = null;
    tick();
  });
}

        const body = 'VIENNA — Colonel Dragan Vasko, military attaché of the People\'s Republic of Karvonia, celebrates his birthday tonight with a gala for eighty guests. Born in Karvograd on 14 November 1946, the Colonel is known for his medals, his moustache and his modesty, according to his own press office. The consulate has ordered forty bottles of French champagne for the occasion. Police have closed the Rennweg until midnight.';
        wrapText(ctx, body, 470).forEach((l, i) => ctx.fillText(l, -pw / 2 + 470, -ph / 2 + 345 + i * 31));
        ctx.font = `italic 500 20px ${FONT_TYPE}`;
        ctx.fillText('Col. Vasko, in a portrait he commissioned himself.', -pw / 2 + 60, ph / 2 - 40);
        ctx.restore();
        ctx.save(); ctx.globalAlpha = a * 0.8;
        ctx.textAlign = 'center'; ctx.font = `600 26px ${FONT_UI}`; ctx.fillStyle = '#f0e4c8';
        ctx.fillText('Click to put the paper away', W / 2, H - 30);
        ctx.restore();
      },
      click() {
        if (this.t < 0.3) return;
        G.overlay = null;
        resolve();
        run(async () => { await say(G.jack, 'Born on the 14th of November, 1946. Everything about him is about him. Worth remembering.'); });
      },
      key(k) { if (k === 'Escape' || k === ' ' || k === 'Enter') this.click(); },
    };
  });
}

// ---------- safe keypad overlay ----------------------------------------------------
function openKeypad() {
  return new Promise(resolve => {
    const code = '141146';
    const pad = {
      t: 0, entry: '', state: 'idle', stT: 0, tries: 0,
      keys() {
        const out = [], x0 = W / 2 - 170, y0 = 400;
        const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'OK'];
        labels.forEach((l, i) => out.push({ l, x: x0 + (i % 3) * 120, y: y0 + Math.floor(i / 3) * 110, w: 100, h: 90 }));
        return out;
      },
      press(l) {
        if (this.state !== 'idle') return;
        Sound.sfx('beep');
        if (l === 'C') this.entry = '';
        else if (l === 'OK') this.submit();
        else if (this.entry.length < 6) { this.entry += l; if (this.entry.length === 6) setTimeout(() => this.submit(), 250); }
      },
      submit() {
        if (this.state !== 'idle') return;
        if (this.entry === code) { this.state = 'ok'; this.stT = 0; Sound.sfx('unlock'); }
        else { this.state = 'bad'; this.stT = 0; this.tries++; Sound.sfx('error'); }
      },
      close(ok) {
        G.overlay = null;
        resolve(ok);
        if (!ok && this.tries >= 2) {
          run(async () => {
            if (flag('readPaper') || flag('sawCard')) await say(G.jack, 'Six digits. Ilse said everything Vasko owns is about himself... Day, month, year?');
            else await say(G.jack, 'Six digits. I need to know more about the Colonel. Something personal. His desk, or the evening paper, might help.');
          });
        }
      },
      draw(ctx, dt) {
        this.t += dt; this.stT += dt;
        if (this.state === 'bad' && this.stT > 0.9) { this.state = 'idle'; this.entry = ''; }
        if (this.state === 'ok' && this.stT > 1.0) return this.close(true);
        const a = clamp(this.t * 5, 0, 1);
        ctx.save(); ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H);
        // steel panel
        const px = W / 2 - 230, py = 150, pw = 460, ph = 820;
        ctx.fillStyle = linGrad(ctx, px, py, px + pw, py + ph, [[0, '#6b7880'], [0.5, '#3a444a'], [1, '#22282c']]);
        rrect(ctx, px, py, pw, ph, 16); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#9aa6ae'; ctx.font = `600 20px ${FONT_UI}`; ctx.textAlign = 'center';
        ctx.fillText('TRESORBAU KÖLN  ·  MODELL 6', W / 2, py + 50);
        // display
        ctx.fillStyle = '#061008'; rrect(ctx, px + 40, py + 80, pw - 80, 120, 8); ctx.fill();
        const col = this.state === 'bad' ? '#ff4a4a' : this.state === 'ok' ? '#6bff9a' : '#3aff9a';
        ctx.fillStyle = col; ctx.font = `700 72px ${FONT_TYPE}`;
        const txt = this.state === 'bad' ? 'ERROR' : this.state === 'ok' ? 'OPEN' : (this.entry + '______').slice(0, 6).split('').join(' ');
        ctx.fillText(txt, W / 2, py + 165);
        glow(ctx, W / 2, py + 140, 160, col === '#ff4a4a' ? 'rgba(255,60,60,0.2)' : 'rgba(60,255,150,0.15)');
        for (const k of this.keys()) {
          const hov = G.mouse.x > k.x && G.mouse.x < k.x + k.w && G.mouse.y > k.y && G.mouse.y < k.y + k.h;
          ctx.fillStyle = hov ? '#c8d0d6' : '#9aa6ae';
          rrect(ctx, k.x, k.y, k.w, k.h, 10); ctx.fill();
          ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(k.x, k.y + k.h - 8, k.w, 8);
          ctx.fillStyle = '#1a2024'; ctx.font = `700 40px ${FONT_UI}`;
          ctx.fillText(k.l, k.x + k.w / 2, k.y + 58);
        }
        ctx.fillStyle = 'rgba(240,228,200,0.8)'; ctx.font = `500 26px ${FONT_UI}`;
        ctx.fillText('Type or click the code  ·  Esc or click outside to step away', W / 2, H - 40);
        ctx.restore();
      },
      click(x, y) {
        const k = this.keys().find(k => x > k.x && x < k.x + k.w && y > k.y && y < k.y + k.h);
        if (k) return this.press(k.l);
        if (x < W / 2 - 230 || x > W / 2 + 230 || y < 150 || y > 970) this.close(false);
      },
      key(k) {
        if (k === 'Escape') return this.close(false);
        if (/^[0-9]$/.test(k)) this.press(k);
        if (k === 'Backspace') this.entry = this.entry.slice(0, -1);
        if (k === 'Enter') this.press('OK');
      },
    };
    G.overlay = pad;
  });
}

// ---- js/rooftop.js
// ---------------------------------------------------------------------------
// Rooftop — the action sequence. Run across the rain-soaked roofs of Vienna,
// hide from the searchlights behind chimneys and leap the gaps.
// ---------------------------------------------------------------------------
const ROOF_Y = 800;
const WORLD_W = 6400;
const BEAM_HW = 0.12;

const Rooftop = {
  layers: null,
  segments: [[0, 1300], [1470, 2700], [2890, 4300], [4480, 6400]],
  chimneys: [620, 1080, 1900, 2380, 3200, 3620, 4050, 4900, 5380],
  lights: [
    { x: 820, speed: 0.7, amp: 0.55, ph: 0 },
    { x: 1700, speed: 0.55, amp: 0.6, ph: 1.4 },
    { x: 2350, speed: 0.9, amp: 0.5, ph: 2.2 },
    { x: 3300, speed: 0.65, amp: 0.6, ph: 0.4 },
    { x: 3950, speed: 1.0, amp: 0.5, ph: 3.0 },
    { x: 4800, speed: 0.75, amp: 0.6, ph: 1.0 },
    { x: 5500, speed: 1.1, amp: 0.55, ph: 2.6 },
  ],
  zipX: 6150,

  buildLayers() {
    if (this.layers) return;
    const sky = makeCanvas(W, H), s = sky.getContext('2d');
    paintSky(s, 0, H, '#050b16', '#0e1e34', 'rgba(200,120,70,0.3)');
    ellipse(s, 1500, 200, 46, 46, '#e8ecf0');
    glow(s, 1500, 200, 260, 'rgba(180,210,255,0.3)');
    const far = makeCanvas(W + 1500, H), f = far.getContext('2d');
    paintDome(f, 900, 700, 1.2, '#0c1522', 'rgba(255,170,100,0.12)');
    paintSkyline(f, 17, 760, 260, '#0d1622', 0.7, { x1: W + 1540 });
    f.fillStyle = '#0d1622'; f.fillRect(0, 755, W + 1500, H - 755);
    fog(f, 500, 820, 'rgba(110,140,170,0.25)', 1);
    const mid = makeCanvas(W + 3200, H), m = mid.getContext('2d');
    paintSkyline(m, 23, 860, 300, '#111b27', 0.85, { x1: W + 3240, noDomes: true });
    m.fillStyle = '#111b27'; m.fillRect(0, 855, W + 3200, H - 855);
    painterly(sky, { strokes: 40000 });
    painterly(far, { strokes: 60000 });
    painterly(mid, { strokes: 80000 });
    this.layers = { sky, far, mid };
  },

  start() {
    this.buildLayers();
    G.mode = 'rooftop'; G.paused = false; G.speech = []; G.overlay = null; G.choices = null;
    G.sceneId = 'rooftop';
    this.checkpoint = this.checkpoint && this.retry ? this.checkpoint : 180;
    this.retry = false;
    this.reset();
    this.rain = new Rain(380, { color: 'rgba(190,215,235,0.3)', angle: 0.28 });
    this.introT = 0;
    Sound.playMusic('action');
    Sound.setAmbience(['rain', 'wind']);
    G.fadeTo = 0;
  },
  reset() {
    const j = makeFigure(flag('tux') ? 'jackTux' : 'jack', this.checkpoint, ROOF_Y, { id: 'jack', scale: 1.55, seed: 1 });
    this.j = j;
    this.vx = 0; this.vy = 0; this.onGround = true; this.exposure = 0; this.dead = false; this.done = false;
    this.camX = clamp(j.x - W * 0.35, 0, WORLD_W - W);
    this.still = 0; this.t = 0;
    this.jumpQueued = false;
  },
  groundAt(x) { return this.segments.some(([a, b]) => x >= a && x <= b); },
  inCover(x) { return this.chimneys.find(c => Math.abs(x - c) < 62); },

  key(k, down) {
    if (!down) return;
    if ((k === ' ' || k === 'w' || k === 'W' || k === 'ArrowUp') && this.onGround && !this.dead) this.jumpQueued = true;
  },
  click(x, y, button) {
    if (button === 'right' && this.onGround) this.jumpQueued = true;
  },

  update(dt) {
    if (this.done) return;
    const j = this.j;
    this.t += dt; this.introT += dt;
    this.rain.update(dt);
    if (this.dead) return;

    // input: keyboard or holding the mouse on either side of Jack
    let dir = 0;
    if (KEYS.ArrowRight || KEYS.d || KEYS.D) dir += 1;
    if (KEYS.ArrowLeft || KEYS.a || KEYS.A) dir -= 1;
    if (!dir && G.mouse.down) {
      const sx = j.x - this.camX;
      if (Math.abs(G.mouse.x - sx) > 40) dir = G.mouse.x > sx ? 1 : -1;
    }
    const speed = 470;
    if (this.onGround) {
      this.vx = dir * speed;
      if (this.jumpQueued) { this.vy = -980; this.onGround = false; Sound.sfx('jump'); if (!dir) this.vx = j.facing * speed; }
    }
    this.jumpQueued = false;
    if (dir) j.facing = dir;

    const before = Math.floor(j.walkPhase / Math.PI);
    j.x = clamp(j.x + this.vx * dt, 40, WORLD_W - 40);
    if (!this.onGround) {
      this.vy += 2500 * dt;
      j.y += this.vy * dt;
      if (j.y >= ROOF_Y && j.y < ROOF_Y + 40 && this.vy > 0 && this.groundAt(j.x)) {
        j.y = ROOF_Y; this.onGround = true; this.vy = 0; Sound.sfx('land');
      }
      if (j.y > H + 200) return this.fail('fell');
    } else if (!this.groundAt(j.x)) {
      this.onGround = false; this.vy = 0;
    }
    j.walking = this.onGround && Math.abs(this.vx) > 0;
    j.running = true;
    j.airborne = !this.onGround;
    if (j.walking) j.walkPhase += Math.abs(this.vx) * dt / (44 * j.scale) * Math.PI * 0.9;
    if (Math.floor(j.walkPhase / Math.PI) !== before && j.walking) Sound.sfx('stepWet');
    this.still = j.walking || !this.onGround ? 0 : this.still + dt;
    j.crouch = lerp(j.crouch, this.still > 0.08 ? 1 : 0, 0.25);

    // checkpoints at every chimney passed
    for (const c of this.chimneys) if (j.x > c + 70 && c + 20 > this.checkpoint) this.checkpoint = c + 20;

    // searchlight exposure
    // Standing still behind a chimney hides you (the crouch animation catches up).
    const hidden = this.onGround && this.vx === 0 && this.inCover(j.x) !== undefined;
    let lit = false;
    for (const L of this.lights) {
      const a = this.beamAngle(L);
      const tx = j.x, ty = j.y - 110 * (1 - j.crouch * 0.4);
      const ang = Math.atan2(tx - L.x, (ROOF_Y + 420) - ty);
      if (Math.abs(ang - a) < BEAM_HW) lit = true;
    }
    this.lit = lit; this.hidden = hidden;
    if (lit && !hidden) {
      if (this.exposure === 0) Sound.sfx('spotted');
      this.exposure += dt * 2.4;
    } else this.exposure = Math.max(0, this.exposure - dt * 0.3);
    if (this.exposure >= 1) return this.fail('spotted');

    // camera
    const target = clamp(j.x - W * 0.38, 0, WORLD_W - W);
    this.camX += (target - this.camX) * Math.min(1, dt * 5);

    if (j.x >= this.zipX - 30 && this.onGround) this.finish();
  },
  beamAngle(L) { return Math.sin(this.t * L.speed + L.ph) * L.amp; },

  async fail(why) {
    if (this.dead) return;
    this.dead = true;
    Sound.sfx(why === 'spotted' ? 'alarm' : 'whoosh');
    this.failText = why === 'spotted' ? 'SPOTTED! The guards open fire from the courtyard.' : 'You missed the jump.';
    await wait(1.6);
    G.fadeTo = 1; await waitUntil(() => G.fade > 0.98);
    this.reset();
    this.failText = null;
    G.fadeTo = 0;
  },
  async finish() {
    if (this.done) return;
    this.done = true;
    const j = this.j;
    j.walking = false; j.crouch = 0; j.arm = 'toast'; j.facing = 1;
    Sound.sfx('zip');
    // slide down the cable into the dark
    const sx = j.x, sy = j.y;
    const t0 = G.t;
    await waitUntil(() => {
      const p = clamp((G.t - t0) / 2.4, 0, 1);
      j.x = sx + ease(p) * 1400; j.y = sy - 170 + ease(p) * 560 + 170 * (1 - Math.min(1, p * 6));
      j.airborne = true;
      this.camX = clamp(this.camX + 4, 0, WORLD_W + 400 - W);
      return p >= 1;
    });
    G.fadeTo = 1; await waitUntil(() => G.fade > 0.98);
    store.set('nightglass_save', null);
    await Ending.play();
  },

  draw(ctx) {
    const L = this.layers, cam = this.camX;
    ctx.drawImage(L.sky, 0, 0);
    ctx.drawImage(L.far, -cam * 0.2, 0);
    // beams behind the mid layer too (sky sweep)
    this.drawBeams(ctx, cam, true);
    ctx.drawImage(L.mid, -cam * 0.5, 0);
    this.drawRoofs(ctx, cam);
    // zip line mast + cable
    const zx = this.zipX - cam;
    ctx.fillStyle = '#0a0e12'; ctx.fillRect(zx - 8, ROOF_Y - 300, 16, 300);
    ctx.strokeStyle = 'rgba(180,190,200,0.7)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(zx, ROOF_Y - 290); ctx.lineTo(zx + 1800, ROOF_Y + 400); ctx.stroke();
    glow(ctx, zx, ROOF_Y - 300, 24, 'rgba(255,60,60,0.9)', 0.6 + 0.4 * Math.sin(G.t * 5));
    if (!this.done || true) {
      const j = this.j;
      const draw = { ...j, x: j.x - cam };
      drawFigure(ctx, draw, G.t, { ambient: 'rgba(6,14,28,0.45)', key: this.lit ? 'rgba(230,240,255,0.55)' : 'rgba(150,180,220,0.2)', keyX: this.lit ? draw.x : 0 });
    }
    this.drawBeams(ctx, cam, false);
    this.rain.draw(ctx);
    drawVignette(ctx, 0.75);
    drawGrain(ctx, 0.06);
    this.drawHud(ctx);
  },
  drawBeams(ctx, cam, sky) {
    ctx.save();
    if (!sky) { ctx.beginPath(); ctx.rect(0, 0, W, ROOF_Y + 8); ctx.clip(); }
    ctx.globalCompositeOperation = 'lighter';
    for (const L of this.lights) {
      const x = L.x - cam, y = ROOF_Y + 420;
      if (x < -900 || x > W + 900) continue;
      const a = this.beamAngle(L), len = 1700, hw = BEAM_HW;
      ctx.fillStyle = linGrad(ctx, x, y, x + Math.sin(a) * len, y - Math.cos(a) * len, [[0, sky ? 'rgba(200,220,255,0.12)' : 'rgba(215,230,255,0.28)'], [0.35, sky ? 'rgba(200,220,255,0.06)' : 'rgba(215,230,255,0.16)'], [1, 'rgba(0,0,0,0)']]);
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.lineTo(x + Math.sin(a - hw) * len, y - Math.cos(a - hw) * len);
      ctx.lineTo(x + Math.sin(a + hw) * len, y - Math.cos(a + hw) * len);
      ctx.closePath(); ctx.fill();
      if (!sky) {
        // hot spot where the beam crosses the roof line
        const d = (y - ROOF_Y) / Math.cos(a);
        glow(ctx, x + Math.sin(a) * d, ROOF_Y - 60, 120, 'rgba(220,235,255,0.25)');
      }
    }
    ctx.restore();
  },
  drawRoofs(ctx, cam) {
    for (const [a, b] of this.segments) {
      const x0 = a - cam, x1 = b - cam;
      if (x1 < -50 || x0 > W + 50) continue;
      // building body below the roof
      ctx.fillStyle = linGrad(ctx, 0, ROOF_Y, 0, H, [[0, '#1c232c'], [1, '#07090c']]);
      ctx.fillRect(x0, ROOF_Y, x1 - x0, H - ROOF_Y);
      // windows below
      for (let x = x0 + 40; x < x1 - 40; x += 110) {
        const lit = ((x + cam) * 13 | 0) % 5 === 0;
        ctx.fillStyle = lit ? 'rgba(255,190,110,0.6)' : 'rgba(12,16,22,0.9)';
        ctx.fillRect(x, ROOF_Y + 80, 40, 70);
      }
      // parapet + zinc roof edge
      ctx.fillStyle = '#2e3842'; ctx.fillRect(x0 - 6, ROOF_Y - 8, x1 - x0 + 12, 16);
      ctx.fillStyle = 'rgba(200,215,230,0.35)'; ctx.fillRect(x0 - 6, ROOF_Y - 8, x1 - x0 + 12, 2);
      // gap drop shadow
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x1, ROOF_Y, 12, H - ROOF_Y);
    }
    for (const c of this.chimneys) {
      const x = c - cam;
      if (x < -120 || x > W + 120) continue;
      ctx.fillStyle = linGrad(ctx, x - 50, 0, x + 50, 0, [[0, '#2a1a14'], [0.5, '#5a3426'], [1, '#2a1a14']]);
      ctx.fillRect(x - 50, ROOF_Y - 170, 100, 170);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2;
      for (let y = ROOF_Y - 160; y < ROOF_Y; y += 18) { ctx.beginPath(); ctx.moveTo(x - 50, y); ctx.lineTo(x + 50, y); ctx.stroke(); }
      ctx.fillStyle = '#3a2a22'; ctx.fillRect(x - 58, ROOF_Y - 184, 116, 18);
      for (const px of [-26, 0, 26]) { ctx.fillStyle = '#6b3a24'; ctx.fillRect(x + px - 7, ROOF_Y - 214, 14, 30); }
      // steam
      const st = (G.t * 0.3 + c) % 1;
      ctx.save(); ctx.globalAlpha = (1 - st) * 0.15; ellipse(ctx, x + st * 40, ROOF_Y - 220 - st * 120, 20 + st * 40, 14 + st * 20, '#cfd8e0'); ctx.restore();
    }
  },
  drawHud(ctx) {
    ctx.save();
    // exposure meter
    const x = W / 2 - 200, y = 40;
    ctx.fillStyle = 'rgba(6,10,14,0.7)'; rrect(ctx, x - 20, y - 16, 440, 64, 10); ctx.fill();
    ctx.font = `600 20px ${FONT_UI}`; ctx.textAlign = 'left';
    ctx.fillStyle = this.hidden ? '#8fe0b0' : this.lit ? '#ff9a9a' : '#cfc6b4';
    ctx.fillText(this.hidden ? 'HIDDEN' : this.lit ? 'IN THE LIGHT' : 'EXPOSURE', x, y + 6);
    ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(x, y + 16, 400, 12);
    ctx.fillStyle = this.exposure > 0.6 ? '#ff4a4a' : '#f0b35b'; ctx.fillRect(x, y + 16, 400 * clamp(this.exposure, 0, 1), 12);
    // progress
    const p = clamp(this.j.x / this.zipX, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(64, H - 60, 300, 4);
    ctx.fillStyle = '#f0b35b'; ctx.fillRect(64, H - 60, 300 * p, 4);
    ctx.font = `600 18px ${FONT_UI}`; ctx.fillStyle = '#cfc6b4'; ctx.fillText('DISTANCE TO THE ZIP LINE', 64, H - 72);
    // instructions
    if (this.introT < 9) {
      const a = clamp(Math.min(this.introT, 9 - this.introT), 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(6,10,14,0.75)'; rrect(ctx, W / 2 - 520, H - 250, 1040, 150, 14); ctx.fill();
      ctx.textAlign = 'center'; ctx.fillStyle = '#f0b35b'; ctx.font = `600 24px ${FONT_UI}`;
      ctx.fillText('ESCAPE ACROSS THE ROOFTOPS', W / 2, H - 208);
      ctx.fillStyle = '#f0e4c8'; ctx.font = `500 30px ${FONT_UI}`;
      ctx.fillText('A / D or ← / → to run   ·   SPACE to jump the gaps', W / 2, H - 164);
      ctx.fillText('Stop behind a chimney to crouch and hide from the searchlights', W / 2, H - 124);
      ctx.globalAlpha = 1;
    }
    if (this.failText) drawLabel(ctx, this.failText, W / 2, H / 2);
    ctx.restore();
  },
};

// Main — title screen, story text screens, new game / continue, boot.
// ---------------------------------------------------------------------------

let TITLE_BG = null;
function titleBg() {
  if (TITLE_BG) return TITLE_BG;
  const c = makeCanvas(W, H), x = c.getContext('2d');
  paintSky(x, 0, H, '#040912', '#0c1a2e', 'rgba(210,120,60,0.35)');
  ellipse(x, 1480, 230, 50, 50, '#e6eaee');
  glow(x, 1480, 230, 300, 'rgba(180,210,255,0.3)');
  paintDome(x, 1260, 760, 1.25, '#0b1420', 'rgba(255,170,100,0.14)');
  paintSkyline(x, 71, 800, 280, '#0c1520', 0.7);
  fog(x, 560, 900, 'rgba(110,140,175,0.28)', 1);
  paintSkyline(x, 83, 900, 220, '#0f1822', 0.9, { noDomes: true });
  x.fillStyle = '#0f1822'; x.fillRect(0, 895, W, H - 895);
  // foreground roof with chimney and our man, silhouetted
  x.fillStyle = '#05070a';
  poly(x, [0, H, 0, 930, 820, 900, 1100, 930, 1100, H], '#05070a');
  x.fillRect(180, 760, 90, 160); x.fillRect(170, 750, 110, 16);
  x.fillRect(190, 720, 16, 32); x.fillRect(222, 720, 16, 32); x.fillRect(254, 720, 16, 32);
  painterly(c, { strokes: 80000 });
  canvasWeave(x);
  TITLE_BG = c;
  return c;
}

const Title = {
  t: 0, planeT: 4,
  show() {
    G.mode = 'title'; G.fade = 1; G.fadeTo = 0; G.paused = false;
    G.overlay = null; G.choices = null; G.speech = [];
    this.t = 0;
    this.rain = this.rain || new Rain(360, { color: 'rgba(190,215,235,0.28)', angle: 0.22 });
    this.jack = makeFigure('jackTux', 720, 902, { scale: 1.9, facing: 1, seed: 1 });
    Sound.setAmbience(['rain', 'wind']);
    Sound.playMusic('title');
  },
  items() {
    const list = [{ text: 'New Mission', act: () => newGame() }];
    if (hasSave()) list.unshift({ text: 'Continue Mission', act: () => loadGame() });
    list.push({ text: document.fullscreenElement ? 'Exit Full Screen' : 'Play Full Screen', act: () => toggleFullscreen() });
    return list.map((it, i) => ({ ...it, x: 120, y: 690 + i * 74, w: 460, h: 62 }));
  },
  click(x, y) {
    if (this.t < 0.4) return;
    Sound.playMusic('title');
    const r = this.items().find(r => x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h);
    if (r) { Sound.sfx('click'); r.act(); }
  },
  draw(ctx, dt) {
    this.t += dt;
    const bg = titleBg();
    const z = 1 + Math.min(this.t, 40) * 0.0015;
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.drawImage(bg, -W / 2, -H / 2); ctx.restore();
    // searchlights
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const [sx, sp, ph] of [[1000, 0.33, 0], [1650, 0.27, 2], [420, 0.4, 4]]) {
      const a = Math.sin(this.t * sp + ph) * 0.55, len = 1300, hw = 0.05;
      ctx.fillStyle = linGrad(ctx, sx, H, sx + Math.sin(a) * len, H - Math.cos(a) * len, [[0, 'rgba(200,220,255,0.2)'], [1, 'rgba(0,0,0,0)']]);
      ctx.beginPath(); ctx.moveTo(sx, H); ctx.lineTo(sx + Math.sin(a - hw) * len, H - Math.cos(a - hw) * len); ctx.lineTo(sx + Math.sin(a + hw) * len, H - Math.cos(a + hw) * len); ctx.fill();
    }
    ctx.restore();
    // the stealth plane passing overhead
    this.planeT -= dt;
    if (this.planeT < 0) {
      const p = -this.planeT / 7;
      if (p > 1) this.planeT = 12 + Math.random() * 6;
      else drawStealth(ctx, W + 200 - p * (W + 500), 200 + p * 60, 1.1 - p * 0.3);
    }
    // our man on the roof
    this.jack.crouch = 0;
    drawFigure(ctx, this.jack, this.t, { ambient: 'rgba(0,0,0,0.72)', key: 'rgba(160,190,230,0.35)', keyX: 1480 });
    this.rain.update(dt); this.rain.draw(ctx);
    drawVignette(ctx, 0.8);
    drawGrain(ctx, 0.07);

    // title type
    const a = clamp((this.t - 0.4) / 1.4, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.textAlign = 'left';
    ctx.font = `600 34px ${FONT_UI}`; ctx.fillStyle = '#f0b35b';
    ctx.fillText('O P E R A T I O N', 124, 300);
    ctx.font = `italic 700 168px ${FONT_DISPLAY}`;
    ctx.shadowColor = 'rgba(240,179,91,0.35)'; ctx.shadowBlur = 40;
    ctx.fillStyle = '#efe4cc'; ctx.fillText('Nightglass', 110, 450);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(240,179,91,0.8)'; ctx.fillRect(124, 490, 90, 3);
    ctx.font = `500 30px ${FONT_UI}`; ctx.fillStyle = '#cfc6b4';
    ctx.fillText('Vienna, 1987. One night. One microfilm. No second chances.', 124, 540);
    ctx.font = `600 22px ${FONT_UI}`; ctx.fillStyle = 'rgba(207,198,180,0.7)';
    ctx.fillText('PLAYABLE DEMO  ·  CHAPTER ONE', 124, 580);
    // menu
    ctx.font = `600 44px ${FONT_UI}`;
    for (const r of this.items()) {
      const hov = G.mouse.x > r.x && G.mouse.x < r.x + r.w && G.mouse.y > r.y && G.mouse.y < r.y + r.h;
      ctx.fillStyle = hov ? '#f0b35b' : '#e6dcc6';
      ctx.fillText((hov ? '—  ' : '') + r.text, 124, r.y + 46);
    }
    ctx.font = `500 22px ${FONT_UI}`; ctx.fillStyle = 'rgba(207,198,180,0.55)';
    ctx.fillText(Sound.ctx ? 'Headphones recommended  ·  F for full screen  ·  M to mute' : 'Click anywhere to switch on sound  ·  F for full screen', 124, H - 60);
    ctx.textAlign = 'right';
    ctx.fillText('A tribute to the Delphine spy adventures of 1990', W - 64, H - 60);
    ctx.restore();
  },
};

// F-117-style faceted flying wing.
function drawStealth(ctx, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  poly(ctx, [-110, 0, 60, -18, 80, 0, 60, 18], '#05080c');
  poly(ctx, [-30, 0, 40, -70, 60, -62, 30, 0], '#070a0f');
  poly(ctx, [-30, 0, 40, 70, 60, 62, 30, 0], '#070a0f');
  poly(ctx, [50, -8, 80, -28, 86, -24, 64, -4], '#05080c');
  glow(ctx, 40, -66, 10, 'rgba(255,60,60,0.9)', Math.sin(G.t * 6) > 0 ? 1 : 0.1);
  ctx.restore();
}

// Typewritten story pages over the city.
const TextScreen = {
  pages: [], i: 0, chars: 0, t: 0, resolve: null,
  play(pages, music) {
    return new Promise(resolve => {
      this.pages = pages; this.i = 0; this.chars = 0; this.t = 0; this.resolve = resolve;
      G.mode = 'text'; G.fadeTo = 0;
      if (music) Sound.playMusic(music);
      Sound.setAmbience(['rain']);
    });
  },
  skip() {
    const p = this.pages[this.i];
    if (!p) return;
    const full = p.text.length;
    if (this.chars < full) { this.chars = full; return; }
    Sound.sfx('click');
    this.i++; this.chars = 0; this.t = 0;
    if (this.i >= this.pages.length) {
      const r = this.resolve; this.resolve = null;
      G.fade = 1;
      r && r();
    }
  },
  draw(ctx, dt) {
    this.t += dt;
    const bg = titleBg();
    const z = 1.1 + this.t * 0.004;
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.drawImage(bg, -W / 2 - 200, -H / 2 + 60); ctx.restore();
    ctx.fillStyle = 'rgba(3,6,10,0.72)'; ctx.fillRect(0, 0, W, H);
    drawGrain(ctx, 0.08);
    drawVignette(ctx, 0.9);
    const p = this.pages[this.i];
    if (!p) return;
    const before = Math.floor(this.chars);
    this.chars = Math.min(p.text.length, this.chars + dt * 42);
    if (Math.floor(this.chars) !== before && p.text[Math.floor(this.chars)] !== ' ' && Math.floor(this.chars) % 2 === 0) Sound.sfx('typewriter');
    ctx.save();
    ctx.textAlign = 'left';
    const x = 300;
    if (p.kicker) {
      ctx.font = `600 28px ${FONT_UI}`; ctx.fillStyle = '#f0b35b';
      ctx.fillText(p.kicker.split('').join(String.fromCharCode(8202)), x, 360);
      ctx.fillStyle = 'rgba(240,179,91,0.7)'; ctx.fillRect(x, 378, 70, 2);
    }
    ctx.font = p.big ? `italic 700 96px ${FONT_DISPLAY}` : `400 44px ${FONT_TYPE}`;
    ctx.fillStyle = '#ece2cc';
    const lines = wrapText(ctx, p.text, 1320);
    let left = Math.floor(this.chars);
    lines.forEach((l, k) => {
      const show = l.slice(0, Math.max(0, left));
      left -= l.length + 1;
      ctx.fillText(show, x, 460 + k * (p.big ? 110 : 66));
    });
    if (this.chars >= p.text.length && Math.sin(this.t * 4) > 0) {
      ctx.font = `600 24px ${FONT_UI}`; ctx.fillStyle = 'rgba(207,198,180,0.75)';
      ctx.fillText(this.i < this.pages.length - 1 ? 'CLICK TO CONTINUE' : 'CLICK TO BEGIN', x, H - 140);
    }
    ctx.restore();
  },
};

const INTRO = [
  { kicker: 'VIENNA  ·  14 NOVEMBER 1987', text: 'Three days ago, the plans for NIGHTGLASS, the West\'s first invisible stealth fighter, vanished from a hangar in the Nevada desert.' },
  { kicker: 'THE TRAIL', text: 'It ends here, at the consulate of the People\'s Republic of Karvonia. Tonight its military attaché, Colonel Dragan Vasko, is throwing himself a birthday gala.' },
  { kicker: 'THE DEADLINE', text: 'At midnight the microfilm leaves Vienna in a diplomatic bag. Nobody can touch a diplomatic bag. So it must never reach one.' },
  { kicker: 'THE AGENT', text: 'Your name is Jack Harrow. Officially, you are not in Austria.' },
];
const OUTRO = [
  { kicker: 'THE RINGSTRASSE  ·  23:52', text: 'The car is waiting at the bottom of the cable, engine running. Ilse drives without a word.' },
  { kicker: 'THE SAFE HOUSE', text: 'Jack threads the microfilm into the viewer. Blueprints appear: wing sections, radar-absorbent panels, the Nightglass prototype.' },
  { kicker: 'THE LAST FRAME', text: 'A handwritten note. "Too slow, Mr. Harrow. The real plans left for Karvonia yesterday. Happy birthday to me. V."' },
  { kicker: 'TO BE CONTINUED', text: 'Operation Nightglass continues in Karvonia.', big: true },
  { kicker: 'END OF THE DEMO', text: 'Thank you for playing. Mission complete, Agent Harrow.', big: true },
];

const Ending = {
  async play() {
    G.fade = 1;
    await TextScreen.play(OUTRO, 'end');
    Title.show();
  },
};

async function newGame() {
  G.flags = {}; G.inv = []; G.sel = null; G.objective = '';
  store.del('nightglass_save');
  G.fade = 1;
  await TextScreen.play(INTRO, 'hotel');
  startPlay();
  G.sceneId = null;
  G.fade = 1;
  await gotoScene('hotel', 960, 930, 1, { instant: true });
}

// ---------- boot ------------------------------------------------------------------
async function boot() {
  try { if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]); }
  catch (e) { /* fonts optional */ }
  // Pre-paint the title while the loading card shows.
  titleBg();
  const load = document.getElementById('loading');
  if (load) load.hidden = true;
  Title.show();
  requestAnimationFrame(frame);
  // Paint the remaining scenes in idle time so scene changes are instant.
  const queue = Object.keys(SCENES);
  const next = () => {
    const id = queue.shift();
    if (!id) return;
    sceneBg(id);
    setTimeout(next, 60);
  };
  setTimeout(next, 800);
}
boot();
