<title>Operation Nightglass</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

    --bone: #efe4cc;

  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
  }
  #game {
    display: block;
    max-width: 100%;
    cursor: none;
    touch-action: none;
    image-rendering: auto;
    background: #000;
  }
  #loading {
    position: fixed; inset: 0;
    display: grid; place-content: center; gap: 14px;
    text-align: center;

    padding-inline: 16px;

  #loading h1 {

  #loading p {
    margin: 0;
    letter-spacing: 0.3em;
    text-transform: uppercase;

  #loading .bar { width: min(320px, 70vw); height: 2px; margin: 12px auto 0; background: #1a1f26; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 40%; background: var(--amber); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { #loading .bar i { animation: none; width: 100%; } }
</style>

<canvas id="game" aria-label="Operation Nightglass, a point-and-click spy adventure"></canvas>
<div id="loading">
  <p>Operation</p>
  <h1>Nightglass</h1>
  <p style="color: var(--muted); letter-spacing: 0.2em;">Painting Vienna…</p>
  <div class="bar"><i></i></div>
</div>

<script>
// ---- js/util.js
// ---------------------------------------------------------------------------
// Operation Nightglass — shared helpers: math, colour, painting primitives.
// ---------------------------------------------------------------------------
const W = 1920, H = 1080;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

// Deterministic RNG so painted scenes look identical on every load.
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

// --- gradients -------------------------------------------------------------
function linGrad(ctx, x0, y0, x1, y1, stops) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  return g;
}
function radGrad(ctx, x, y, r0, r1, stops) {
  const g = ctx.createRadialGradient(x, y, r0, x, y, r1);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  return g;
}

// --- shapes ----------------------------------------------------------------
function poly(ctx, pts, fill, stroke, lw) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}
function rect(ctx, x, y, w, h, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function ellipse(ctx, x, y, rx, ry, fill, rot = 0) {
  ctx.beginPath();
  ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2);
  ctx.fillStyle = fill; ctx.fill();
}

// Additive soft light.
function glow(ctx, x, y, r, color, alpha = 1) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha;
  ctx.fillStyle = radGrad(ctx, x, y, 0, r, [[0, color], [1, 'rgba(0,0,0,0)']]);
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.restore();
}

// A cone of light falling from (x,y) downward, spreading to width w at height h.
function lightCone(ctx, x, y, topW, w, h, color, alpha = 0.35) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(x - topW / 2, y);
  ctx.lineTo(x + topW / 2, y);
  ctx.lineTo(x + w / 2, y + h);
  ctx.lineTo(x - w / 2, y + h);
  ctx.closePath();
  ctx.fillStyle = linGrad(ctx, 0, y, 0, y + h, [[0, color], [1, 'rgba(0,0,0,0)']]);
  ctx.fill();
  ctx.restore();
}

// Hazy vertical fog band.
function fog(ctx, y0, y1, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = linGrad(ctx, 0, y0, 0, y1, [[0, 'rgba(0,0,0,0)'], [0.5, color], [1, 'rgba(0,0,0,0)']]);
  ctx.fillRect(0, y0, W, y1 - y0);
  ctx.restore();
}

// Scatter of short strokes for texture (wood grain, plaster, fabric).
function texture(ctx, x, y, w, h, color, n, len, seed, alpha = 0.15, angle = 0) {
  const r = rng(seed);
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const px = x + r() * w, py = y + r() * h, a = angle + (r() - 0.5) * 0.3, l = len * (0.4 + r());
    ctx.moveTo(px, py);
    ctx.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l);
  }
  ctx.stroke();
  ctx.restore();
}

// --- painterly pass ----------------------------------------------------------
// Re-lays the image as thousands of small directional brush dabs sampled from
// itself. Softens hard vector edges into something that reads as paint.
function painterly(canvas, opts = {}) {
  const { strokes = 90000, min = 2, max = 7, alpha = 0.55, seed = 7 } = opts;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const src = ctx.getImageData(0, 0, w, h).data;
  const r = rng(seed);
  for (let i = 0; i < strokes; i++) {
    const x = (r() * w) | 0, y = (r() * h) | 0;
    const k = (y * w + x) * 4;
    if (src[k + 3] < 250) continue; // leave transparent areas untouched
    // Stroke direction follows a slow flow field.
    const a = Math.sin(x * 0.004 + y * 0.002) * 1.2 + Math.cos(y * 0.006) * 0.6;
    const len = min + r() * (max - min);
    ctx.setTransform(Math.cos(a), Math.sin(a), -Math.sin(a), Math.cos(a), x, y);
    ctx.fillStyle = `rgba(${src[k]},${src[k + 1]},${src[k + 2]},${alpha})`;
    ctx.fillRect(-len, -len * 0.28, len * 2, len * 0.56);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// Canvas-texture grain baked into the painting (static).
function canvasWeave(ctx, seed = 3, alpha = 0.05) {
  const r = rng(seed);
  ctx.save();
  ctx.globalAlpha = alpha;
  for (let i = 0; i < 26000; i++) {
    ctx.fillStyle = r() > 0.5 ? '#fff' : '#000';
    ctx.fillRect(r() * W, r() * H, 1 + r() * 2, 1);
  }
  ctx.restore();
}

// --- post effects (per frame) ------------------------------------------------
let _grain = null;
function grainCanvas() {
  if (_grain) return _grain;
  _grain = makeCanvas(256, 256);
  const g = _grain.getContext('2d');
  const d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = Math.random() * 255;
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255;
  }
  g.putImageData(d, 0, 0);
  return _grain;
}
function drawGrain(ctx, alpha = 0.05) {
  const g = grainCanvas();
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'overlay';
  const ox = (Math.random() * 256) | 0, oy = (Math.random() * 256) | 0;
  ctx.translate(-ox, -oy);
  ctx.fillStyle = ctx.createPattern(g, 'repeat');
  ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
}
let _vig = null;
function drawVignette(ctx, strength = 0.75) {
  if (!_vig) {
    _vig = makeCanvas(W, H);
    const v = _vig.getContext('2d');
    v.fillStyle = radGrad(v, W / 2, H * 0.48, H * 0.35, H * 1.05, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,1)']]);
    v.fillRect(0, 0, W, H);
  }
  ctx.save(); ctx.globalAlpha = strength; ctx.drawImage(_vig, 0, 0); ctx.restore();
}

// Rain: a pool of falling streaks, re-used per scene.
class Rain {
  constructor(n, opts = {}) {
    this.opts = Object.assign({ angle: 0.18, speed: 1900, color: 'rgba(190,215,230,0.35)', len: 38, x0: 0, x1: W, y0: 0, y1: H }, opts);
    this.drops = [];
    for (let i = 0; i < n; i++) this.drops.push(this.spawn(true));
    this.splashes = [];
  }
  spawn(anywhere) {
    const o = this.opts;
    const z = 0.4 + Math.random() * 0.6; // depth
    return { x: o.x0 + Math.random() * (o.x1 - o.x0 + 200) - 100, y: anywhere ? o.y0 + Math.random() * (o.y1 - o.y0) : o.y0 - Math.random() * 200, z };
  }
  update(dt, groundY) {
    const o = this.opts;
    for (const d of this.drops) {
      d.y += o.speed * d.z * dt;
      d.x += o.speed * d.z * dt * o.angle;
      if (d.y > (groundY ? groundY - 60 + d.z * 140 : o.y1)) {
        if (groundY && Math.random() < 0.35) this.splashes.push({ x: d.x, y: d.y, t: 0 });
        Object.assign(d, this.spawn(false));
      }
    }
    for (const s of this.splashes) s.t += dt;
    this.splashes = this.splashes.filter(s => s.t < 0.25);
  }
  draw(ctx) {
    const o = this.opts;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = o.color;
    ctx.lineCap = 'round';
    for (const layer of [0, 1]) {
      ctx.lineWidth = layer ? 2 : 1;
      ctx.beginPath();
      for (const d of this.drops) {
        if ((d.z > 0.75) !== !!layer) continue;
        const l = o.len * d.z;
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - l * o.angle, d.y - l);
      }
      ctx.stroke();
    }
    ctx.lineWidth = 1.2;
    for (const s of this.splashes) {
      ctx.globalAlpha = 1 - s.t / 0.25;
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, 4 + s.t * 40, 1 + s.t * 6, 0, Math.PI, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// Point-in-polygon + nearest point, for walk areas.
function inPoly(x, y, p) {
  let inside = false;
  for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
    const xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function nearestInPoly(x, y, p) {
  if (inPoly(x, y, p)) return [x, y];
  let best = null, bd = Infinity;
  for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
    const ax = p[j], ay = p[j + 1], bx = p[i], by = p[i + 1];
    const dx = bx - ax, dy = by - ay;
    const t = clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy || 1), 0, 1);
    const cx = ax + dx * t, cy = ay + dy * t, d = dist(x, y, cx, cy);
    if (d < bd) { bd = d; best = [cx, cy]; }
  }
  // Nudge inward toward the polygon's centroid so we're strictly inside.
  let mx = 0, my = 0;
  for (let i = 0; i < p.length; i += 2) { mx += p[i]; my += p[i + 1]; }
  mx /= p.length / 2; my /= p.length / 2;
  return [best[0] + (mx - best[0]) * 0.01, best[1] + (my - best[1]) * 0.01];
}

function wrapText(ctx, text, maxW) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } },
};

// ---- js/audio.js
// ---------------------------------------------------------------------------
// Audio — everything is synthesised live with WebAudio, no sound files.
// ---------------------------------------------------------------------------
const Sound = {
  ctx: null, master: null, musicBus: null, sfxBus: null, ambBus: null,
  amb: {}, music: null, muted: false,

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.8;
    this.master.connect(this.ctx.destination);
    // Shared reverb makes everything sit in the same space.
    this.verb = this.ctx.createConvolver();
    this.verb.buffer = this.impulse(2.8, 2.2);
    const verbGain = this.ctx.createGain(); verbGain.gain.value = 0.35;
    this.verb.connect(verbGain).connect(this.master);
    for (const name of ['musicBus', 'sfxBus', 'ambBus']) {
      this[name] = this.ctx.createGain();
      this[name].connect(this.master);
      this[name].connect(this.verb);
    }
    this.musicBus.gain.value = 0.42;
    this.sfxBus.gain.value = 0.8;
    this.ambBus.gain.value = 0.6;
    this.noiseBuf = this.makeNoise(3);
  },

  impulse(sec, decay) {
    const len = this.ctx.sampleRate * sec, b = this.ctx.createBuffer(2, len, this.ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return b;
  },
  makeNoise(sec) {
    const len = this.ctx.sampleRate * sec, b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.04 * w) / 1.04; d[i] = w * 0.5 + last * 3; }
    return b;
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 0.8, this.ctx.currentTime, 0.1);
    return this.muted;
  },

  // --- ambience loops ---------------------------------------------------------
  setAmbience(list) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    for (const k of Object.keys(this.amb)) {
      if (!list.includes(k)) {
        const a = this.amb[k];
        a.gain.gain.setTargetAtTime(0, t, 0.6);
        setTimeout(() => { try { a.stop(); } catch (e) { /* already stopped */ } }, 3000);
        delete this.amb[k];
      }
    }
    for (const k of list) if (!this.amb[k]) this.amb[k] = this['amb_' + k]();
  },
  noiseLoop(filterType, freq, q, vol, bus) {
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain(); g.gain.value = 0;
    g.gain.setTargetAtTime(vol, this.ctx.currentTime, 1.2);
    src.connect(f).connect(g).connect(bus || this.ambBus);
    src.start();
    return { gain: g, filter: f, stop: () => src.stop() };
  },
  amb_rain() { return this.noiseLoop('bandpass', 2600, 0.4, 0.5); },
  amb_rainWindow() { return this.noiseLoop('lowpass', 900, 0.7, 0.35); },
  amb_room() { return this.noiseLoop('lowpass', 220, 0.5, 0.25); },
  amb_crowd() {
    // Murmur of a reception: formant-filtered noise with a slow wobble.
    const a = this.noiseLoop('bandpass', 520, 2.2, 0.28);
    const lfo = this.ctx.createOscillator(), lg = this.ctx.createGain();
    lfo.frequency.value = 0.7; lg.gain.value = 160;
    lfo.connect(lg).connect(a.filter.frequency); lfo.start();
    const stop = a.stop; a.stop = () => { stop(); lfo.stop(); };
    return a;
  },
  amb_wind() {
    const a = this.noiseLoop('bandpass', 400, 1.5, 0.45);
    const lfo = this.ctx.createOscillator(), lg = this.ctx.createGain();
    lfo.frequency.value = 0.13; lg.gain.value = 260;
    lfo.connect(lg).connect(a.filter.frequency); lfo.start();
    const stop = a.stop; a.stop = () => { stop(); lfo.stop(); };
    return a;
  },

  // --- music: a slow generative noir score ------------------------------------
  // Each mood is a chord progression; a pad plays the chords, a muted bass
  // walks the roots and a lonely vibraphone-ish voice improvises in the scale.
  moods: {
    title:   { bpm: 64, chords: [[50, 57, 60, 65], [46, 53, 58, 62], [43, 50, 55, 58], [45, 52, 57, 61]], scale: [62, 65, 67, 69, 70, 72, 74, 77], lead: 0.5 },
    hotel:   { bpm: 58, chords: [[50, 57, 60, 64], [48, 55, 58, 62], [46, 53, 57, 62], [45, 52, 55, 61]], scale: [62, 64, 65, 67, 69, 70, 72, 74], lead: 0.35 },
    street:  { bpm: 62, chords: [[45, 52, 55, 60], [41, 48, 52, 57], [43, 50, 53, 58], [40, 47, 52, 56]], scale: [64, 67, 69, 71, 72, 74, 76], lead: 0.3 },
    cafe:    { bpm: 92, chords: [[50, 53, 57, 60], [43, 53, 55, 59], [48, 52, 55, 59], [45, 52, 55, 61]], scale: [62, 64, 65, 67, 69, 71, 72, 74, 76], lead: 0.8, swing: true },
    gala:    { bpm: 84, chords: [[53, 57, 60, 64], [50, 57, 62, 65], [46, 53, 58, 62], [48, 55, 60, 64]], scale: [65, 67, 69, 70, 72, 74, 76, 77], lead: 0.65, waltz: true },
    tension: { bpm: 76, chords: [[45, 48, 52, 55], [45, 48, 51, 56], [44, 47, 51, 54], [45, 48, 52, 55]], scale: [69, 70, 72, 75, 76, 79], lead: 0.25 },
    action:  { bpm: 128, chords: [[45, 52, 57, 60], [41, 48, 53, 57], [43, 50, 55, 58], [40, 47, 52, 56]], scale: [69, 72, 74, 76, 79, 81], lead: 0.5, drive: true },
    end:     { bpm: 60, chords: [[50, 57, 62, 65], [46, 53, 58, 62], [48, 55, 60, 64], [45, 52, 57, 61]], scale: [62, 65, 67, 69, 72, 74, 77], lead: 0.45 },
  },
  playMusic(mood) {
    if (!this.ctx || (this.music && this.music.mood === mood)) return;
    this.stopMusic();
    const m = this.moods[mood];
    const state = { mood, alive: true, step: 0, next: this.ctx.currentTime + 0.15 };
    this.music = state;
    const beat = 60 / m.bpm;
    const tick = () => {
      if (!state.alive) return;
      while (state.next < this.ctx.currentTime + 0.4) {
        this.musicStep(m, state, state.next, beat);
        state.next += beat / 2;
        state.step++;
      }
      state.timer = setTimeout(tick, 100);
    };
    tick();
  },
  stopMusic() {
    if (this.music) { this.music.alive = false; clearTimeout(this.music.timer); this.music = null; }
  },
  musicStep(m, st, t, beat) {
    const beatsPerBar = m.waltz ? 3 : 4, half = st.step;
    const bar = Math.floor(half / (beatsPerBar * 2));
    const chord = m.chords[bar % m.chords.length];
    const inBar = half % (beatsPerBar * 2);
    if (inBar === 0) chord.forEach((n, i) => this.pad(n + 12, t, beat * beatsPerBar * 1.05, 0.05 - i * 0.004));
    // Bass
    if (m.drive) {
      if (inBar % 1 === 0) this.bass(chord[0] - 12 + (inBar % 4 === 3 ? 7 : 0), t, beat * 0.45, 0.22);
    } else if (m.waltz) {
      if (inBar === 0) this.bass(chord[0] - 12, t, beat, 0.2);
      if (inBar === 2 || inBar === 4) chord.slice(1, 3).forEach(n => this.pluck(n, t, 0.05));
    } else if (inBar % 2 === 0) {
      const walk = [0, 7, 12, 10][(inBar / 2) % 4];
      this.bass(chord[0] - 12 + (m.swing ? walk : (inBar === 0 ? 0 : 7)), t + (m.swing && inBar % 4 === 2 ? beat * 0.08 : 0), beat * 0.9, m.swing ? 0.2 : 0.14);
    }
    // Brushed hat for swing / drive
    if (m.swing && inBar % 2 === 1) this.hat(t + beat * 0.16, 0.05);
    if (m.drive) { this.hat(t, inBar % 2 ? 0.05 : 0.08); if (inBar % 4 === 0) this.kick(t); }
    // Lead improvisation
    if (Math.random() < m.lead * 0.45) {
      const n = m.scale[Math.floor(Math.random() * m.scale.length)];
      this.vibe(n, t + (m.swing && half % 2 ? beat * 0.12 : 0), beat * (0.8 + Math.random() * 1.6), 0.07);
    }
  },
  freq(n) { return 440 * Math.pow(2, (n - 69) / 12); },
  env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  },
  pad(n, t, dur, vol) {
    const c = this.ctx, g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1100;
    for (const det of [-7, 7]) {
      const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = this.freq(n); o.detune.value = det;
      o.connect(f); o.start(t); o.stop(t + dur + 0.1);
    }
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.35); g.gain.linearRampToValueAtTime(0, t + dur);
    f.connect(g).connect(this.musicBus);
  },
  bass(n, t, dur, vol) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = this.freq(n); f.type = 'lowpass'; f.frequency.value = 500;
    this.env(g, t, 0.01, vol, dur);
    o.connect(f).connect(g).connect(this.musicBus); o.start(t); o.stop(t + dur + 0.05);
  },
  pluck(n, t, vol) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.value = this.freq(n);
    this.env(g, t, 0.005, vol, 0.5);
    o.connect(g).connect(this.musicBus); o.start(t); o.stop(t + 0.6);
  },
  vibe(n, t, dur, vol) {
    const c = this.ctx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), trem = c.createOscillator(), tg = c.createGain();
    o.type = 'sine'; o.frequency.value = this.freq(n);
    o2.type = 'sine'; o2.frequency.value = this.freq(n) * 4; const g2 = c.createGain(); g2.gain.value = 0.12;
    trem.frequency.value = 5.5; tg.gain.value = vol * 0.3;
    this.env(g, t, 0.01, vol, dur + 0.6);
    trem.connect(tg).connect(g.gain);
    o.connect(g); o2.connect(g2).connect(g);
    g.connect(this.musicBus);
    [o, o2, trem].forEach(x => { x.start(t); x.stop(t + dur + 0.7); });
  },
  hat(t, vol) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; f.type = 'highpass'; f.frequency.value = 7000;
    this.env(g, t, 0.002, vol, 0.08);
    s.connect(f).connect(g).connect(this.musicBus); s.start(t, Math.random() * 2); s.stop(t + 0.1);
  },
  kick(t) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
    this.env(g, t, 0.003, 0.35, 0.25);
    o.connect(g).connect(this.musicBus); o.start(t); o.stop(t + 0.3);
  },

  // --- one-shot effects -------------------------------------------------------
  sfx(name) {
    if (!this.ctx) return;
    const fn = this['sfx_' + name];
    if (fn) fn.call(this, this.ctx.currentTime);
  },
  burst(t, type, freq, q, dur, vol, a = 0.005) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    this.env(g, t, a, vol, dur);
    s.connect(f).connect(g).connect(this.sfxBus); s.start(t, Math.random() * 2); s.stop(t + dur + 0.05);
  },
  tone(t, type, f0, f1, dur, vol) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    this.env(g, t, 0.005, vol, dur);
    o.connect(g).connect(this.sfxBus); o.start(t); o.stop(t + dur + 0.05);
  },
  sfx_step(t) { this.burst(t, 'lowpass', 300 + Math.random() * 150, 1, 0.09, 0.22); },
  sfx_stepWet(t) { this.burst(t, 'bandpass', 900 + Math.random() * 300, 0.8, 0.12, 0.2); },
  sfx_click(t) { this.tone(t, 'square', 1800, 1200, 0.03, 0.05); },
  sfx_hover(t) { this.tone(t, 'sine', 1400, 1400, 0.03, 0.02); },
  sfx_pickup(t) { this.tone(t, 'sine', 660, 660, 0.12, 0.12); this.tone(t + 0.09, 'sine', 990, 990, 0.25, 0.1); },
  sfx_ring(t) {
    for (let r = 0; r < 2; r++) for (let i = 0; i < 16; i++) {
      this.tone(t + r * 0.45 + i * 0.025, 'triangle', 1100, 1100, 0.02, 0.07);
      this.tone(t + r * 0.45 + i * 0.025, 'triangle', 1350, 1350, 0.02, 0.05);
    }
  },
  sfx_phoneUp(t) { this.burst(t, 'lowpass', 800, 1, 0.12, 0.3); },
  sfx_door(t) { this.burst(t, 'lowpass', 180, 2, 0.5, 0.4, 0.02); this.tone(t, 'sine', 90, 60, 0.3, 0.15); },
  sfx_briefcase(t) { this.tone(t, 'square', 2400, 1800, 0.02, 0.08); this.tone(t + 0.08, 'square', 2400, 1800, 0.02, 0.08); },
  sfx_paper(t) { this.burst(t, 'highpass', 3000, 0.5, 0.35, 0.12, 0.05); },
  sfx_coin(t) { this.tone(t, 'sine', 2600, 2600, 0.3, 0.06); this.tone(t + 0.07, 'sine', 3200, 3200, 0.25, 0.05); },
  sfx_beep(t) { this.tone(t, 'square', 1500, 1500, 0.07, 0.06); },
  sfx_error(t) { this.tone(t, 'square', 220, 180, 0.3, 0.08); },
  sfx_unlock(t) { this.tone(t, 'square', 800, 800, 0.05, 0.06); this.burst(t + 0.2, 'lowpass', 400, 3, 0.2, 0.4); this.tone(t + 0.3, 'sine', 120, 70, 0.4, 0.2); },
  sfx_clink(t) { this.tone(t, 'sine', 3100, 3100, 0.6, 0.06); this.tone(t, 'sine', 4650, 4650, 0.4, 0.03); },
  sfx_dart(t) { this.burst(t, 'highpass', 2500, 1, 0.12, 0.3); this.tone(t, 'sine', 1800, 400, 0.12, 0.05); },
  sfx_thud(t) { this.tone(t, 'sine', 110, 45, 0.35, 0.4); this.burst(t, 'lowpass', 200, 1, 0.25, 0.4); },
  sfx_jump(t) { this.burst(t, 'bandpass', 700, 1, 0.2, 0.2); },
  sfx_land(t) { this.tone(t, 'sine', 140, 50, 0.2, 0.3); this.burst(t, 'lowpass', 500, 1, 0.15, 0.3); },
  sfx_alarm(t) {
    for (let i = 0; i < 4; i++) this.tone(t + i * 0.7, 'sawtooth', 700, 1100, 0.35, 0.05), this.tone(t + i * 0.7 + 0.35, 'sawtooth', 1100, 700, 0.35, 0.05);
  },
  sfx_spotted(t) { this.tone(t, 'sawtooth', 300, 900, 0.25, 0.08); },
  sfx_whoosh(t) { this.burst(t, 'bandpass', 900, 0.6, 1.2, 0.25, 0.5); },
  sfx_sting(t) { [57, 60, 63, 66].forEach((n, i) => this.tone(t + i * 0.02, 'sawtooth', this.freq(n), this.freq(n), 1.6, 0.03)); },
  sfx_zip(t) { const c = this.ctx; this.tone(t, 'sawtooth', 200, 90, 2.4, 0.04); this.burst(t, 'bandpass', 1800, 4, 2.4, 0.15, 0.1); },
  sfx_drink(t) { for (let i = 0; i < 3; i++) this.burst(t + i * 0.18, 'bandpass', 500, 3, 0.1, 0.15); },
  sfx_typewriter(t) { this.burst(t, 'bandpass', 2400 + Math.random() * 800, 3, 0.04, 0.12); },
};

// Scratch buffer the figure is rendered into before lighting.
const FIG_BUF = makeCanvas(720, 760);
const FIG_CTX = FIG_BUF.getContext('2d');

// Pose resolver: turns a figure's state into joint angles.
function resolvePose(f, t) {
  const p = {
    hipY: -92, lean: (f.look.stoop || 0),
    legs: [{ thigh: 0, knee: 0.04 }, { thigh: 0, knee: 0.04 }],
    arms: [{ upper: 0.08, fore: -0.15 }, { upper: -0.04, fore: -0.1 }],
    bob: 0, headTilt: 0,
  };
  const breathe = Math.sin(t * 1.7 + (f.seed || 0)) * 0.8;
  p.bob = breathe * 0.6;

  if (f.walking) {
    const ph = f.walkPhase;
    for (let i = 0; i < 2; i++) {
      const q = ph + i * Math.PI;
      p.legs[i].thigh = 0.46 * Math.sin(q);
      p.legs[i].knee = 0.06 + 0.75 * Math.max(0, Math.cos(q)) * (Math.sin(q) < 0.6 ? 1 : 0.6);
      p.arms[1 - i].upper = -0.4 * Math.sin(q);
      p.arms[1 - i].fore = 0.2 + 0.35 * Math.max(0, -Math.sin(q));
    }
    p.bob = -Math.abs(Math.cos(ph)) * 4 + 2;
    p.lean += f.running ? 0.18 : 0.03;
  }
  if (f.pose === 'sit') {
    p.hipY = -50;
    p.legs[0] = { thigh: 1.45, knee: 1.45 };
    p.legs[1] = { thigh: 1.35, knee: 1.5 };
  }
  if (f.crouch) {
    const c = f.crouch;
    p.hipY += c * 42;
    p.legs[0].thigh += 1.05 * c; p.legs[0].knee += 2.0 * c;
    p.legs[1].thigh += 0.7 * c; p.legs[1].knee += 1.9 * c;
    p.lean += 0.35 * c;
  }
  if (f.airborne) {
    p.legs[0] = { thigh: 0.9, knee: 1.3 }; p.legs[1] = { thigh: -0.3, knee: 0.9 };
    p.arms[0] = { upper: -1.2, fore: 0.4 }; p.arms[1] = { upper: 1.8, fore: 0.5 };
  }
  // Arm poses (index 1 = near arm, drawn in front).
  const arm = f.arm || 'rest';
  const wob = Math.sin(t * 2.3) * 0.04;
  if (arm === 'tray') p.arms[1] = { upper: 0.2, fore: 1.35 + wob };
  if (arm === 'phone') p.arms[1] = { upper: 0.45, fore: 2.45 };
  if (arm === 'point') p.arms[1] = { upper: 1.5, fore: 0.05 };
  if (arm === 'reach') p.arms[1] = { upper: 0.95, fore: 0.35 };
  if (arm === 'behind') { p.arms[0] = { upper: -0.2, fore: -0.5 }; p.arms[1] = { upper: -0.18, fore: -0.55 }; }
  if (arm === 'toast') p.arms[1] = { upper: 2.5 + wob * 3, fore: 0.35 };
  if (arm === 'hold') p.arms[1] = { upper: 0.4, fore: 1.3 };
  if (arm === 'cig') {
    const up = (Math.sin(t * 0.5 + 1) > 0.55);
    p.arms[1] = up ? { upper: 0.35, fore: 2.35 } : { upper: 0.15, fore: 1.3 };
    f._cigUp = up;
  }
  if (arm === 'drunk') {
    p.arms[1] = { upper: 1.3 + Math.sin(t * 1.3) * 0.5, fore: 0.8 };
    p.lean += Math.sin(t * 0.9) * 0.06;
    p.headTilt = Math.sin(t * 1.1) * 0.12;
  }
  if (f.pose === 'sit' && arm === 'rest') p.arms[1] = { upper: 0.5, fore: 1.1 };
  if (f.slump) {
    p.hipY = -16; p.lean = 1.35; p.headTilt = 0.6;
    p.legs[0] = { thigh: 1.55, knee: 0.1 }; p.legs[1] = { thigh: 1.4, knee: 0.3 };
    p.arms[0] = { upper: 0.2, fore: 0.1 }; p.arms[1] = { upper: 0.8, fore: 0.2 };
  }
  return p;
}

function limb(ctx, x, y, a1, l1, a2, l2, w1, w2, color) {
  // a1/a2 are angles from straight-down, positive = forward.
  const kx = x + Math.sin(a1) * l1, ky = y + Math.cos(a1) * l1;
  const ex = kx + Math.sin(a2) * l2, ey = ky + Math.cos(a2) * l2;
  ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = w1;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(kx, ky); ctx.stroke();
  ctx.lineWidth = w2;
  ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(ex, ey); ctx.stroke();
  return [kx, ky, ex, ey];
}

function drawFigureLocal(ctx, f, t) {
  const L = f.look, p = resolvePose(f, t), b = L.build || 1;
  const hipY = p.hipY + p.bob;

  const drawLeg = (i, shade) => {
    const lg = p.legs[i];
    const hx = (i ? 3 : -3);
    const [, , ax, ay] = limb(ctx, hx, hipY, lg.thigh, 46, lg.thigh - lg.knee, 44, 15 * b, 12 * b, shade ? L.coatDark && L.pants ? shadeColor(L.pants, -0.35) : L.pants : L.pants);
    // shoe
    const fa = f.airborne ? 0.4 : (f.pose === 'sit' ? 0 : Math.max(-0.4, Math.min(0.5, lg.thigh - lg.knee)) * 0.5);
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(-fa);
    ctx.fillStyle = shade ? shadeColor(L.shoes, -0.3) : L.shoes;
    ctx.beginPath(); ctx.moveTo(-6, -5); ctx.quadraticCurveTo(14, -8, 17, 1); ctx.lineTo(17, 4); ctx.lineTo(-6, 4); ctx.closePath(); ctx.fill();
    ctx.restore();
  };

  // Upper body is rotated around the hip by the lean angle.
  const withUpper = fn => {
    ctx.save(); ctx.translate(0, hipY); ctx.rotate(p.lean); ctx.translate(0, -hipY); fn(); ctx.restore();
  };
  const shoulderY = hipY - 56, sx = 2;

  const drawArm = (i, shade) => {
    withUpper(() => {
      const a = p.arms[i];
      const col = shade ? L.coatDark : L.coat;
      const [ex, ey, hx, hy] = limb(ctx, sx + (i ? 2 : -4), shoulderY + 6, a.upper, 30, a.upper + a.fore, 28, 12 * b, 10.5 * b, col);
      // cuff + hand
      ellipse(ctx, hx, hy, 5, 5.5, shade ? shadeColor(L.skin, -0.3) : L.skin);
      if (i === 1 && f.arm === 'tray') {
        ctx.fillStyle = '#c9ccd0'; ctx.fillRect(hx - 26, hy - 8, 52, 4);
        for (let k = 0; k < (f.trayGlasses ?? 3); k++) drawFlute(ctx, hx - 18 + k * 14, hy - 8);
      }
      if (i === 1 && (f.arm === 'toast' || f.holding === 'glass')) drawFlute(ctx, hx, hy - 4);
      if (i === 1 && f.arm === 'phone') { ctx.fillStyle = '#111'; ctx.fillRect(hx - 4, hy - 16, 8, 30); }
      if (i === 1 && f.arm === 'point') { ctx.fillStyle = '#1b1b1b'; ctx.fillRect(hx, hy - 2, 16, 3.5); ctx.fillStyle = '#c9a13b'; ctx.fillRect(hx + 13, hy - 2, 3, 3.5); }
      if (i === 1 && f.arm === 'cig') {
        ctx.fillStyle = '#eee'; ctx.fillRect(hx + 2, hy - 3, 10, 2);
        glow(ctx, hx + 12, hy - 2, 6, 'rgba(255,120,40,0.9)', 0.9);
        f._cigTip = [hx + 12, hy - 2];
      }
      if (i === 1 && f.holding === 'film') { ctx.fillStyle = '#2a2a2a'; ctx.fillRect(hx - 3, hy - 8, 6, 10); }
    });
  };

  // shadow
  if (!f.airborne) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(4, 0, 38 * b, 7, 0, 0, Math.PI * 2); ctx.fill();
  }

  drawArm(0, true);
  drawLeg(0, true);
  const coatLong = L.top === 'trench' || L.top === 'longcoat' || L.top === 'tails';
  if (!coatLong) drawLeg(1, false);

  withUpper(() => {
    const top = hipY - 58, w = 17 * b;
    // Coat skirt (for long coats) swings with the legs.
    if (coatLong) {
      const sw = f.walking ? Math.sin(f.walkPhase) * 6 : 0;
      const hem = L.top === 'tails' ? hipY + 18 : f.pose === 'sit' ? hipY + 8 : hipY + 52 + (L.female ? 6 : 0);
      if (L.top === 'tails') {
        poly(ctx, [-w + 1, hipY - 6, -w - 2 - sw * 0.5, hem + 26, -w + 10, hem + 30, 0, hipY], L.coatDark);
      } else {
        poly(ctx, [-w, hipY - 8, w + 2, hipY - 8, w + 8 + sw, hem, -w - 6 - sw * 0.5, hem + 2], linGrad(ctx, -w, 0, w, 0, [[0, L.coatDark], [0.7, L.coat], [1, shadeColor(L.coat, 0.08)]]));
        // fold line
        ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(4, hipY); ctx.lineTo(6 + sw, hem); ctx.stroke();
      }
    }
    if (L.apron) poly(ctx, [-w + 3, hipY - 12, w - 1, hipY - 12, w + 2, hipY + 62, -w + 1, hipY + 62], L.apron);
    // Torso
    const torso = [-w + 2, top + 4, -w - 1 * b, top + 30, -w + 3, hipY + 2, w, hipY + 2, w + 3 + (L.belly || 0) * 7, top + 38, w + 1, top + 4];
    poly(ctx, torso, linGrad(ctx, -w, 0, w, 0, [[0, L.coatDark], [0.65, L.coat], [1, shadeColor(L.coat, 0.1)]]));
    if (L.belly) ellipse(ctx, w - 2, top + 38, 10 * L.belly, 17 * L.belly, L.top === 'tails' || L.top === 'vest' ? L.shirt : L.coat);
    // Shirt / lapels
    if (L.top === 'tux' || L.top === 'tails' || L.top === 'trench' || L.top === 'waiter' || L.top === 'vest') {
      poly(ctx, [w - 12, top + 3, w - 1, top + 3, w + 1 + (L.belly || 0) * 5, top + 34, w - 5, top + 34], L.shirt);
      if (L.top !== 'waiter' && L.top !== 'vest') {
        poly(ctx, [w - 14, top + 2, w - 7, top + 2, w - 2, top + 36, w - 8, top + 42], shadeColor(L.coat, L.top === 'trench' ? -0.12 : 0.18));
      }
      // bow tie / tie
      if (L.top === 'tux' || L.top === 'tails' || L.top === 'waiter') {
        poly(ctx, [w - 7, top + 5, w + 1, top + 2, w + 1, top + 10, w - 7, top + 7], L.tie);
      } else if (L.top === 'trench') {
        poly(ctx, [w - 4, top + 4, w, top + 4, w + 1, top + 30, w - 3, top + 32], L.tie);
      }
    }
    if (L.top === 'trench') {
      // belt + collar
      rect(ctx, -w, hipY - 16, w * 2 + 2, 6, L.coatDark);
      poly(ctx, [-w + 2, top - 2, w - 4, top - 4, w - 10, top + 14, -w + 6, top + 10], shadeColor(L.coat, -0.08));
    }
    if (L.top === 'uniform') {
      rect(ctx, -w + 1, hipY - 14, w * 2, 6, L.belt);
      rect(ctx, w - 8, hipY - 13, 6, 4, '#b8a14a');
      for (let k = 0; k < 4; k++) ellipse(ctx, w - 3, top + 10 + k * 11, 1.8, 1.8, '#c9a13b');
      poly(ctx, [-w + 2, top + 2, w, top + 2, w - 4, top - 4, -w + 6, top - 4], L.trim);
      rect(ctx, -w + 2, top + 16, 10, 7, L.trim); // ribbon bar

    if (L.sash) poly(ctx, [-w + 2, top + 6, -w + 12, top + 2, w + 6, hipY - 6, w - 4, hipY], L.sash);
    if (L.scarf) poly(ctx, [-w + 4, top - 2, w + 2, top - 3, w + 1, top + 8, -w + 4, top + 7], L.scarf);
    if (L.female && L.top === 'longcoat') {
      poly(ctx, [-w + 3, top - 4, w - 2, top - 6, w - 7, top + 16, -w + 6, top + 10], shadeColor(L.coat, -0.15));
    }

    // Neck + head
    const hx = 6, hy = top - 16;
    rect(ctx, hx - 5, top - 10, 10, 12, shadeColor(L.skin, -0.18));
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(p.headTilt + (f.headTurn || 0));

  if (coatLong) {
    // near leg below the coat hem
    ctx.save();
    drawLeg(1, false);
    ctx.restore();

    withUpper(() => {
      if (L.top === 'tails') return;

}

function drawHead(ctx, f, L, t) {
  const skin = L.flushed ? L.skin : L.skin;
  // back of head / hair under
  if (L.hairStyle === 'bob') {
    ellipse(ctx, -3, 2, 15, 17, shadeColor(L.hair, -0.25));
  }
  // face
  ctx.fillStyle = linGrad(ctx, -12, 0, 12, 0, [[0, shadeColor(skin, -0.28)], [0.6, skin], [1, shadeColor(skin, 0.06)]]);
  ctx.beginPath();
  ctx.moveTo(-10, -12);
  ctx.quadraticCurveTo(4, -17, 11, -8);
  ctx.lineTo(12, -1);        // brow
  ctx.lineTo(15, 4);         // nose tip
  ctx.lineTo(11.5, 6);
  ctx.lineTo(12, 9);         // lips
  ctx.quadraticCurveTo(10, 15, 4, 16); // chin
  ctx.quadraticCurveTo(-6, 16, -10, 6);
  ctx.closePath(); ctx.fill();
  if (L.flushed) glow(ctx, 6, 5, 7, 'rgba(200,40,40,0.5)', 0.8);
  // ear
  ellipse(ctx, -3, 2, 3, 4.5, shadeColor(skin, -0.2));

  const blink = (Math.sin(t * 0.9 + (f.seed || 0) * 3) > 0.985);
  ctx.fillStyle = '#1a1210';
  if (!blink && !f.slump) ctx.fillRect(7, -2, 3, 2.2); else ctx.fillRect(6, -1, 4, 0.8);
  ctx.fillStyle = shadeColor(L.hair === '#d8d4cc' ? '#9a948a' : L.hair, -0.1);
  ctx.fillRect(5, -5, 7, 1.6);
  if (L.monocle) { ctx.strokeStyle = '#d9c27a'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(9, -1, 3.8, 0, 7); ctx.stroke(); }
  // mouth
  const talk = f.talking && Math.sin(t * 22) > -0.2;
  ctx.fillStyle = L.lips || shadeColor(skin, -0.45);
  ctx.fillRect(9, 9, 3.5, talk ? 2.6 : 1.1);
  if (L.mustache) { ctx.fillStyle = shadeColor(L.hair === '#5a5550' ? '#3a3632' : L.hair, -0.1); ctx.fillRect(8, 6.5, 6, 2.5); }

  const h = L.hair;
  if (L.hairStyle === 'slick') {
    ctx.fillStyle = h;
    ctx.beginPath(); ctx.moveTo(-11, 4); ctx.quadraticCurveTo(-14, -16, 2, -17); ctx.quadraticCurveTo(12, -17, 12, -7);
    ctx.quadraticCurveTo(4, -12, -4, -8); ctx.quadraticCurveTo(-6, -2, -7, 6); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-8, -10); ctx.quadraticCurveTo(0, -16, 9, -11); ctx.stroke();
  } else if (L.hairStyle === 'bob') {
    ctx.fillStyle = linGrad(ctx, -14, 0, 12, 0, [[0, shadeColor(h, -0.25)], [1, h]]);
    ctx.beginPath(); ctx.moveTo(-14, 12); ctx.quadraticCurveTo(-18, -18, 2, -18); ctx.quadraticCurveTo(14, -18, 13, -4);
    ctx.quadraticCurveTo(6, -10, 2, -6); ctx.quadraticCurveTo(-1, 4, -2, 13); ctx.closePath(); ctx.fill();
  } else if (L.hairStyle === 'bald') {
    ctx.fillStyle = h;
    ctx.beginPath(); ctx.moveTo(-11, 6); ctx.quadraticCurveTo(-12, -4, -7, -8); ctx.lineTo(-5, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ellipse(ctx, 0, -13, 6, 2, 'rgba(255,255,255,0.12)');
  } else if (L.hairStyle === 'cap') {
    ctx.fillStyle = h; ctx.fillRect(-10, -8, 6, 12);
    poly(ctx, [-13, -11, 13, -11, 16, -21, -9, -24], L.cap);
    rect(ctx, -12, -13, 26, 4, L.capBand);
    poly(ctx, [6, -10, 20, -8, 20, -6, 6, -7], '#111');
    ellipse(ctx, 4, -19, 2.2, 2.2, '#c9a13b');
  } else if (L.hairStyle === 'flatcap') {
    ctx.fillStyle = h; ctx.fillRect(-11, -6, 7, 10);
    poly(ctx, [-13, -9, 10, -14, 20, -8, 12, -6, -12, -3], L.cap);
  }
}

function drawFlute(ctx, x, y) {
  ctx.fillStyle = 'rgba(230,220,180,0.75)';
  ctx.beginPath(); ctx.moveTo(x - 3, y - 18); ctx.lineTo(x + 3, y - 18); ctx.lineTo(x + 1.5, y - 7); ctx.lineTo(x - 1.5, y - 7); ctx.fill();
  ctx.fillStyle = 'rgba(240,200,90,0.8)'; ctx.fillRect(x - 2.5, y - 15, 5, 7);
  ctx.fillStyle = 'rgba(220,220,220,0.8)'; ctx.fillRect(x - 0.6, y - 7, 1.2, 6); ctx.fillRect(x - 3, y - 1.5, 6, 1.5);

function shadeColor(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

// Draw a figure into the scene with scene lighting.
// light: { ambient: 'rgba(...)' (multiply tint), key: 'rgba(...)' (rim), keyX }
function drawFigure(ctx, f, t, light) {
  const s = f.scale;
  const bw = FIG_BUF.width, bh = FIG_BUF.height;
  const c = FIG_CTX;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, bw, bh);
  c.globalCompositeOperation = 'source-over';
  // Local render at fixed 3x so thin details survive, then scale into scene.
  const R = 3.4;
  c.setTransform(R * f.facing, 0, 0, R, bw / 2, bh - 30);
  drawFigureLocal(c, f, t);
  c.setTransform(1, 0, 0, 1, 0, 0);
  // Lighting: ambient tint over the figure only.
  if (light) {
    c.globalCompositeOperation = 'source-atop';
    if (light.ambient) { c.fillStyle = light.ambient; c.fillRect(0, 0, bw, bh); }
    if (light.key) {
      const dir = (light.keyX ?? W / 2) < f.x ? -1 : 1;
      c.fillStyle = linGrad(c, bw / 2 - dir * 120, 0, bw / 2 + dir * 120, 0, [[0, 'rgba(0,0,0,0)'], [0.55, 'rgba(0,0,0,0)'], [1, light.key]]);
      c.fillRect(0, 0, bw, bh);
    }
    if (light.top) {
      c.fillStyle = linGrad(c, 0, bh * 0.2, 0, bh, [[0, light.top], [0.6, 'rgba(0,0,0,0)']]);
      c.fillRect(0, 0, bw, bh);
    }
    c.globalCompositeOperation = 'source-over';
  }
  const k = s / R;
  ctx.drawImage(FIG_BUF, f.x - (bw / 2) * k, f.y - (bh - 30) * k, bw * k, bh * k);
}

// Screen-space bounding box of a figure (for hotspots and speech placement).
function figureBox(f) {
  const s = f.scale, h = (f.pose === 'sit' ? 140 : 190) * s;
  return { x: f.x - 34 * s, y: f.y - h, w: 68 * s, h, headY: f.y - h };
}

// Figure factory.
function makeFigure(lookName, x, y, opts = {}) {
  return Object.assign({
    look: LOOKS[lookName], lookName, x, y, scale: 2, facing: 1, walking: false, walkPhase: 0,
    talking: false, arm: 'rest', pose: 'stand', seed: Math.random() * 10, crouch: 0,
  }, opts);
}

// ---- js/engine.js
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

const FONT_UI = '"Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif';
const FONT_DISPLAY = '"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif';

const COLORS = {
  jack: '#f2e6cf', ilse: '#ff8f8f', franz: '#f3c46b', vendor: '#b9d58c', guard: '#9ec3e6',
  waiter: '#e3d6f5', baron: '#ffb37a', control: '#7fe0d0', vasko: '#ff6b6b', guard2: '#9ec3e6',

const G = {
  mode: 'boot', t: 0, flags: {}, inv: [], sel: null, sceneId: null, scene: null,
  actors: [], jack: null, busy: false, speech: [], choices: null, overlay: null,
  mouse: { x: W / 2, y: H / 2, over: null, down: false }, fade: 1, fadeTo: 0, fadeSpeed: 2,
  objective: '', objT: 0, invOpen: 0, paused: false, notice: null, bgCache: {}, hoverInv: -1,
  pickupFlash: null, skip: false,

// ---------- canvas fit + fullscreen ------------------------------------------
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;

  canvas.style.height = (H * s) + 'px';

window.addEventListener('resize', fit);

      if (r && r.catch) r.catch(() => {});
    } else if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
  } catch (e) { /* fullscreen not available here */ }
}

// ---------- input -----------------------------------------------------------
function toLogical(e) {

}
canvas.addEventListener('mousemove', e => { [G.mouse.x, G.mouse.y] = toLogical(e); });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousedown', e => {

});
canvas.addEventListener('mouseup', () => { G.mouse.down = false; });
canvas.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];

}, { passive: false });
canvas.addEventListener('touchend', () => { G.mouse.down = false; });
const KEYS = {};
window.addEventListener('keydown', e => {
  KEYS[e.key] = true;
  Sound.init();
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === 'm' || e.key === 'M') Sound.toggleMute();
  if (G.overlay && G.overlay.key) { G.overlay.key(e.key); return; }
  if (G.mode === 'rooftop') { Rooftop.key && Rooftop.key(e.key, true); }
  if (e.key === 'Escape') {
    if (G.mode === 'play' || G.mode === 'rooftop') G.paused = !G.paused;
  }
  if ((e.key === ' ' || e.key === 'Enter' || e.key === '.') && G.speech.length) skipSpeech();
  if (G.mode === 'text' && (e.key === ' ' || e.key === 'Enter')) TextScreen.skip();
});
window.addEventListener('keyup', e => { KEYS[e.key] = false; });

function onClick(button) {
  const { x, y } = G.mouse;
  if (G.mode === 'title') return Title.click(x, y);
  if (G.mode === 'text') return TextScreen.skip();
  if (G.paused) return Pause.click(x, y);
  if (G.mode === 'rooftop') return Rooftop.click && Rooftop.click(x, y, button);
  if (G.mode !== 'play') return;
  if (G.overlay) return G.overlay.click && G.overlay.click(x, y, button);
  if (G.choices) return Choices.click(x, y);
  if (G.speech.length) return skipSpeech();
  // Top-right buttons
  if (y < 70 && x > W - 150) return (x > W - 75) ? (G.paused = true) : toggleFullscreen();
  if (G.busy) return;

  // Inventory bar
  if (G.invOpen > 0.5 && y > H - INV.h) {
    const i = invSlotAt(x, y);
    if (i >= 0 && G.inv[i]) {
      const id = G.inv[i];
      if (button === 'right') return run(() => lookItemStory(id));
      if (G.sel && G.sel !== id) return run(() => combineItems(G.sel, id));
      G.sel = G.sel === id ? null : id;
      Sound.sfx('click');
    }
    return;
  }
  if (button === 'right' && G.sel) { G.sel = null; return; }

  const hs = hotspotAt(x, y);
  if (hs) {
    Sound.sfx('click');
    const item = G.sel;
    G.sel = null;
    return run(() => interact(hs, button === 'right' ? 'look' : item ? 'item' : 'default', item));
  }
  if (button === 'left') {
    G.sel = null;
    const [tx, ty] = nearestInPoly(x, y, G.scene.walk);
    run(() => walkTo(tx, ty), true);
  }
}

// ---------- scripting --------------------------------------------------------
let runToken = 0;
// Run a story script. Walk-only scripts are interruptible by a new click.
async function run(fn, interruptible) {
  const token = ++runToken;
  G.busy = !interruptible;
  G.cancelWalk = false;
  try { await fn(token); }
  catch (e) { if (e !== 'cancel') console.error(e); }
  if (token === runToken) G.busy = false;
}
const wait = s => new Promise(r => {
  const end = G.t + s;
  const tick = () => (G.t >= end || G.skipWait) ? r() : requestAnimationFrame(tick);
  tick();
});
function waitUntil(pred) {
  return new Promise(r => { const tick = () => pred() ? r() : requestAnimationFrame(tick); tick(); });
}

// ---------- flags / items ----------------------------------------------------
const flag = (k, v) => (v === undefined ? G.flags[k] : (G.flags[k] = v));
const has = id => G.inv.includes(id);
function addItem(id) {
  if (!has(id)) G.inv.push(id);
  G.pickupFlash = { id, t: 0 };
  Sound.sfx('pickup');
}
function removeItem(id) { G.inv = G.inv.filter(i => i !== id); if (G.sel === id) G.sel = null; }
function setObjective(text) { G.objective = text; G.objT = 0; }
function notify(text, dur = 3) { G.notice = { text, t: 0, dur }; }

// ---------- scenes -----------------------------------------------------------
function sceneBg(id) {
  if (!G.bgCache[id]) {
    const c = makeCanvas(W, H), cx = c.getContext('2d');
    SCENES[id].paint(cx);
    if (SCENES[id].painterly !== false) painterly(c, SCENES[id].painterly || {});
    if (SCENES[id].paintAfter) SCENES[id].paintAfter(cx);
    canvasWeave(cx);
    G.bgCache[id] = c;
  }
  return G.bgCache[id];
}
function depthScale(y) {
  const [y0, s0, y1, s1] = G.scene.depth;
  return lerp(s0, s1, clamp((y - y0) / (y1 - y0), 0, 1));
}
async function gotoScene(id, x, y, facing, opts = {}) {
  if (G.sceneId && !opts.instant) { G.fadeTo = 1; await waitUntil(() => G.fade >= 0.99); }
  Sound.sfx(opts.sfx || 'door');
  const sc = SCENES[id];
  sceneBg(id);
  G.sceneId = id; G.scene = sc;
  G.jack.x = x; G.jack.y = y; G.jack.facing = facing || 1; G.jack.walking = false;
  G.jack.look = LOOKS[flag('tux') ? 'jackTux' : 'jack'];
  G.actors = [G.jack, ...(sc.actors ? sc.actors() : [])];
  G.jack.scale = depthScale(y);
  for (const a of G.actors) if (a !== G.jack && a.depthScale !== false && !a.fixedScale) a.scale = depthScale(a.y) * (a.scaleMul || 1);
  if (sc.rain) sc._rain = new Rain(sc.rain.n, sc.rain);
  Sound.playMusic(sc.music);
  Sound.setAmbience(sc.ambience || []);
  save();
  G.fadeTo = 0;
  G.title = { text: sc.title, t: 0 };
  if (sc.enter) await sc.enter();
}
function actor(id) { return G.actors.find(a => a.id === id); }
function removeActor(id) { G.actors = G.actors.filter(a => a.id !== id); }

// ---------- walking ---------------------------------------------------------
function walkTo(tx, ty, fig = G.jack, speedMul = 1) {
  return new Promise(resolve => {
    fig.target = [tx, ty];
    fig.walking = true;
    fig.speedMul = speedMul;
    fig.onArrive = resolve;
  });
}
function faceTo(x, fig = G.jack) { fig.facing = x < fig.x ? -1 : 1; }
function updateWalker(f, dt) {
  if (!f.walking || !f.target) return;
  const [tx, ty] = f.target;
  const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy);
  const sc = f.scale;
  const speed = (f.running ? 520 : 250) * (sc / 1.9) * (f.speedMul || 1);
  const step = speed * dt;
  if (Math.abs(dx) > 2) f.facing = dx < 0 ? -1 : 1;
  const before = Math.floor(f.walkPhase / Math.PI);
  f.walkPhase += step / (44 * sc) * Math.PI * 0.95;
  if (Math.floor(f.walkPhase / Math.PI) !== before && f === G.jack) Sound.sfx(G.scene && G.scene.wet ? 'stepWet' : 'step');
  if (d <= step) {
    f.x = tx; f.y = ty; f.walking = false; f.target = null;
    const cb = f.onArrive; f.onArrive = null; cb && cb();
  } else {
    f.x += dx / d * step; f.y += dy / d * step;

// ---------- speech ----------------------------------------------------------
// who: a figure, or a string id for off-screen voices ('control').
function say(who, text, opts = {}) {
  return new Promise(resolve => {
    const fig = typeof who === 'string' ? (actor(who) || null) : who;
    const id = typeof who === 'string' ? who : (who.id || 'jack');
    const dur = opts.dur || Math.max(1.8, 0.9 + text.length * 0.055);
    const s = { fig, id, text, t: 0, dur, resolve, color: COLORS[id] || COLORS[fig && fig.id] || '#eee', pos: opts.pos };

function skipSpeech() {
  const s = G.speech[0];

  endSpeech(s);
}
function endSpeech(s) {

function drawSpeech(ctx) {
  const s = G.speech[0];

  ctx.textAlign = 'center';

  const lh = 50;
  y -= (lines.length - 1) * lh;
  y = Math.max(70, y);
  const maxW = Math.max(...lines.map(l => ctx.measureText(l).width));
  x = clamp(x, maxW / 2 + 40, W - maxW / 2 - 40);

  ctx.lineWidth = 9;

  if (!s.fig) {
    ctx.font = `italic 600 44px ${FONT_UI}`;

  lines.forEach((l, i) => {
    ctx.strokeText(l, x, y + i * lh);
    ctx.fillStyle = s.color;
    ctx.fillText(l, x, y + i * lh);
  });
  ctx.restore();
}

// ---------- choices ----------------------------------------------------------
function choose(options) {
  return new Promise(resolve => {
    G.choices = { options: options.filter(Boolean), resolve, hover: -1, t: 0 };

}
const Choices = {
  rows() {
    const opts = G.choices.options, lh = 64;

  click(x, y) {

  draw(ctx) {

// ---------- hotspots --------------------------------------------------------
function hsContains(h, x, y) {
  if (h.when && !h.when()) return false;
  if (h.rect) { const [rx, ry, rw, rh] = h.rect; return x >= rx && x <= rx + rw && y >= ry && y <= ry + rh; }
  if (h.poly) return inPoly(x, y, h.poly);
  if (h.actor) { const a = actor(h.actor); if (!a) return false; const b = figureBox(a); return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h; }
  return false;
}
function hotspotAt(x, y) {
  const list = (G.scene && G.scene.hotspots) || [];
  // Actors and smaller hotspots win: search in reverse declaration order.
  for (let i = list.length - 1; i >= 0; i--) if (hsContains(list[i], x, y)) return list[i];
  return null;
}
function verbLabel(h) {
  const n = typeof h.name === 'function' ? h.name() : h.name;
  if (G.sel) return `Use ${ITEMS[G.sel].name} with ${n}`;
  if (h.exit) return h.exitLabel || `Go to ${n}`;
  if (h.talk) return `Talk to ${n}`;
  if (h.take) return `Pick up ${n}`;
  if (h.use) return `${h.useVerb || 'Use'} ${n}`;
  return `Look at ${n}`;
}
async function approach(h) {
  if (h.at) {
    const [ax, ay] = h.at;
    const [tx, ty] = nearestInPoly(ax, ay, G.scene.walk);
    if (dist(tx, ty, G.jack.x, G.jack.y) > 6) await walkTo(tx, ty);
  }
  if (h.face !== undefined) G.jack.facing = h.face;
  else if (h.rect) faceTo(h.rect[0] + h.rect[2] / 2);
  else if (h.actor && actor(h.actor)) faceTo(actor(h.actor).x);
}
async function interact(h, mode, item) {
  if (mode === 'look') {
    faceToHotspot(h);
    return h.look ? h.look() : say(G.jack, 'Nothing special.');
  }
  await approach(h);
  if (mode === 'item') {
    if (h.item) { const r = await h.item(item); if (r !== false) return; }
    return say(G.jack, pick(['That won\'t work.', 'I don\'t think so.', 'Not a chance.', `The ${ITEMS[item].name.toLowerCase()} doesn't help here.`]));
  }
  if (h.exit) return h.exit();
  if (h.talk) return h.talk();
  if (h.take) return h.take();
  if (h.use) return h.use();
  return h.look ? h.look() : null;
}
function faceToHotspot(h) {
  if (h.rect) faceTo(h.rect[0] + h.rect[2] / 2);
  else if (h.actor && actor(h.actor)) faceTo(actor(h.actor).x);
  else if (h.at) faceTo(h.at[0]);
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ---------- inventory ---------------------------------------------------------
const INV = { h: 150, slot: 116, gap: 18 };
function invSlotRect(i) {
  const n = Math.max(8, G.inv.length);
  const total = n * INV.slot + (n - 1) * INV.gap;
  const x0 = (W - total) / 2;
  const y = H - INV.h + 16 + (1 - G.invOpen) * INV.h;
  return [x0 + i * (INV.slot + INV.gap), y, INV.slot, INV.slot];
}
function invSlotAt(x, y) {
  for (let i = 0; i < Math.max(8, G.inv.length); i++) {
    const [rx, ry, rw, rh] = invSlotRect(i);
    if (x >= rx && x <= rx + rw && y >= ry && y <= ry + rh) return i;
  }
  return -1;
}
async function lookItem(id) { await say(G.jack, ITEMS[id].desc); }
async function combineItems(a, b) {
  G.sel = null;
  await say(G.jack, 'Those two don\'t go together.');
}
function drawInventory(ctx) {
  const want = (G.mode === 'play' && !G.busy && !G.choices && !G.overlay && (G.mouse.y > H - INV.h - 10 || G.sel)) ? 1 : 0;
  G.invOpen += (want - G.invOpen) * 0.2;
  // Always-visible hint tab.
  ctx.save();
  if (G.mode === 'play' && G.invOpen < 0.5 && !G.choices && !G.busy) {
    ctx.globalAlpha = 0.7;
    ctx.font = `600 22px ${FONT_UI}`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(8,12,16,0.6)';
    rrect(ctx, W / 2 - 90, H - 34, 180, 40, 8); ctx.fill();
    ctx.fillStyle = '#d9cdb5';
    ctx.fillText(`INVENTORY  (${G.inv.length})`, W / 2, H - 8);
  }
  ctx.restore();
  if (G.invOpen < 0.02) return;
  ctx.save();
  const y0 = H - INV.h + (1 - G.invOpen) * INV.h;
  ctx.fillStyle = linGrad(ctx, 0, y0 - 40, 0, H, [[0, 'rgba(6,10,14,0)'], [0.3, 'rgba(6,10,14,0.85)'], [1, 'rgba(6,10,14,0.95)']]);
  ctx.fillRect(0, y0 - 40, W, H - y0 + 40);
  G.hoverInv = invSlotAt(G.mouse.x, G.mouse.y);
  for (let i = 0; i < Math.max(8, G.inv.length); i++) {
    const [x, y, w, h] = invSlotRect(i);
    const id = G.inv[i];
    ctx.fillStyle = G.sel && G.sel === id ? 'rgba(240,179,91,0.25)' : 'rgba(255,255,255,0.05)';
    rrect(ctx, x, y, w, h, 10); ctx.fill();
    ctx.strokeStyle = G.hoverInv === i && id ? '#f0b35b' : 'rgba(217,205,181,0.18)';
    ctx.lineWidth = 2; ctx.stroke();
    if (id) {
      ctx.save(); ctx.translate(x + w / 2, y + h / 2); ITEMS[id].icon(ctx, 1); ctx.restore();
    }
  }
  if (G.hoverInv >= 0 && G.inv[G.hoverInv]) {
    const id = G.inv[G.hoverInv];
    const label = G.sel && G.sel !== id ? `Use ${ITEMS[G.sel].name} with ${ITEMS[id].name}` : ITEMS[id].name + '   ·   click to select, right-click to examine';
    drawLabel(ctx, label, W / 2, y0 - 22);

  ctx.restore();
}

// ---------- HUD ---------------------------------------------------------------
function drawLabel(ctx, text, x, y) {
  ctx.save();
  ctx.font = `600 34px ${FONT_UI}`;
  ctx.textAlign = 'center';
  ctx.lineWidth = 7; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(5,8,12,0.9)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = '#f0e4c8';
  ctx.fillText(text, x, y);
  ctx.restore();
}
function drawCursor(ctx) {
  const { x, y } = G.mouse;
  ctx.save();
  if (G.sel && G.mode === 'play') {
    ctx.translate(x + 30, y + 30); ctx.scale(0.6, 0.6); ITEMS[G.sel].icon(ctx, 1);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  const hot = G.mouse.over;
  const r = hot ? 16 + Math.sin(G.t * 8) * 2 : 11;
  ctx.strokeStyle = hot ? '#f0b35b' : 'rgba(240,228,200,0.9)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { ctx.moveTo(x + dx * (r + 4), y + dy * (r + 4)); ctx.lineTo(x + dx * (r + 12), y + dy * (r + 12)); }
  ctx.stroke();
  ctx.fillStyle = hot ? '#f0b35b' : '#f0e4c8';
  ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 7); ctx.fill();
  ctx.restore();
}
function drawHud(ctx, dt) {
  // hover label
  if (G.mode === 'play' && !G.busy && !G.choices && !G.overlay && !G.speech.length) {
    const inInv = G.invOpen > 0.5 && G.mouse.y > H - INV.h;
    const h = inInv ? null : hotspotAt(G.mouse.x, G.mouse.y);
    if (h !== G.mouse.over && h) Sound.sfx('hover');
    G.mouse.over = h;
    if (h) drawLabel(ctx, verbLabel(h), clamp(G.mouse.x, 300, W - 300), Math.max(60, G.mouse.y - 46));
    else if (G.sel && !inInv) drawLabel(ctx, `Use ${ITEMS[G.sel].name} with …`, clamp(G.mouse.x, 300, W - 300), Math.max(60, G.mouse.y - 46));
  } else G.mouse.over = null;

  // scene title card
  if (G.title) {
    G.title.t += dt;
    const a = clamp(Math.min(G.title.t - 0.4, 3.6 - G.title.t), 0, 1);
    if (a > 0) {
      ctx.save(); ctx.globalAlpha = a;
      ctx.font = `600 26px ${FONT_UI}`; ctx.fillStyle = '#f0b35b'; ctx.textAlign = 'left';
      ctx.fillText(G.title.text.toUpperCase().split('').join(String.fromCharCode(8202)), 64, H - 170);
      ctx.fillStyle = 'rgba(240,179,91,0.7)'; ctx.fillRect(64, H - 158, 60, 2);
      ctx.restore();
    }
  }
  // objective toast
  if (G.objective && G.objT < 6) {
    G.objT += dt;
    const a = clamp(Math.min(G.objT, 6 - G.objT), 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = `600 22px ${FONT_UI}`; ctx.fillStyle = '#f0b35b'; ctx.fillText('NEW OBJECTIVE', 64, 70);
    ctx.font = `500 34px ${FONT_UI}`; ctx.fillStyle = '#f0e4c8'; ctx.fillText(G.objective, 64, 110);
    ctx.restore();
  }
  // item pickup flash
  if (G.pickupFlash) {
    const p = G.pickupFlash; p.t += dt;
    const a = clamp(Math.min(p.t * 3, 2.6 - p.t), 0, 1);
    if (p.t > 2.6) G.pickupFlash = null;
    else {
      ctx.save(); ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(6,10,14,0.8)'; rrect(ctx, W / 2 - 260, 60, 520, 110, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(240,179,91,0.5)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.save(); ctx.translate(W / 2 - 190, 115); ctx.scale(0.75, 0.75); ITEMS[p.id].icon(ctx, 1); ctx.restore();
      ctx.textAlign = 'left';
      ctx.font = `600 20px ${FONT_UI}`; ctx.fillStyle = '#f0b35b'; ctx.fillText('ADDED TO INVENTORY', W / 2 - 120, 102);
      ctx.font = `600 36px ${FONT_UI}`; ctx.fillStyle = '#f0e4c8'; ctx.fillText(ITEMS[p.id].name, W / 2 - 120, 142);
      ctx.restore();
    }
  }
  if (G.notice) {
    const n = G.notice; n.t += dt;
    const a = clamp(Math.min(n.t * 3, n.dur - n.t), 0, 1);
    if (n.t > n.dur) G.notice = null;
    else { ctx.save(); ctx.globalAlpha = a; drawLabel(ctx, n.text, W / 2, 200); ctx.restore(); }
  }
  // corner buttons: fullscreen + menu
  if (G.mode === 'play' || G.mode === 'rooftop') {
    ctx.save();
    ctx.globalAlpha = G.mouse.y < 90 && G.mouse.x > W - 170 ? 0.95 : 0.45;
    ctx.strokeStyle = '#f0e4c8'; ctx.lineWidth = 3;
    // fullscreen glyph
    const fx = W - 128, fy = 22;
    ctx.beginPath();
    ctx.moveTo(fx, fy + 10); ctx.lineTo(fx, fy); ctx.lineTo(fx + 10, fy);
    ctx.moveTo(fx + 26, fy); ctx.lineTo(fx + 36, fy); ctx.lineTo(fx + 36, fy + 10);
    ctx.moveTo(fx + 36, fy + 26); ctx.lineTo(fx + 36, fy + 36); ctx.lineTo(fx + 26, fy + 36);
    ctx.moveTo(fx + 10, fy + 36); ctx.lineTo(fx, fy + 36); ctx.lineTo(fx, fy + 26);
    ctx.stroke();
    // menu glyph
    for (let i = 0; i < 3; i++) ctx.fillStyle = '#f0e4c8', ctx.fillRect(W - 62, 24 + i * 13, 36, 4);
    ctx.restore();
  }
}
